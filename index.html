window.addEventListener('resize', () => { resize(); if (gameRunning) initIslands(); });
const W = () => canvas.width;
const H = () => canvas.height;

// Polyfill roundRect for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        r = Math.min(r || 0, w / 2, h / 2);
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
    };
}

// Word banks by difficulty

// Achievements

let unlockedAchievements = [];
let achievementPopup = null, achievementPopupTimer = 0;

// ========== SAVE SYSTEM ==========
let cachedSave = null;
let lastSaveFloor = -1;

function saveGame() {
    const prev = loadSave();
    const data = {
        highScore: Math.max(score, prev.highScore || 0),
        bestLevel: Math.max(currentLevel, prev.bestLevel || 0),
        totalLifetimeCollected: totalCollected + (prev.totalLifetimeCollected || 0),
        totalFriendsMerged: prev.totalFriendsMerged || 0,
        unlockedTier: Math.max(getMaxTier(), prev.unlockedTier || 0),
        lastScore: score,
        lastLevel: currentLevel,
        lastFriends: friends.map(f => ({ tier: f.tier, typeIdx: f.typeIdx })),
        version: 3,
    };
    localStorage.setItem('cloudBunny3', JSON.stringify(data));
    cachedSave = data;
}

function loadSave() {
    if (cachedSave) return cachedSave;
    try { cachedSave = JSON.parse(localStorage.getItem('cloudBunny3') || '{}'); return cachedSave; } catch { return {}; }
}

function getMaxTier() {
    return friends.reduce((max, f) => Math.max(max, f.tier), 0);
}

function showSavedInfo() {
    const s = loadSave();
    const info = document.getElementById('savedInfo');
    const cont = document.getElementById('continueBtn');
    if (s.highScore) {
        info.textContent = `High Score: ${s.highScore} | Best Level: ${(LEVELS[s.bestLevel || 0] || LEVELS[0]).name}`;
        if (s.lastScore > 0) {
            cont.style.display = 'inline-block';
            cont.textContent = `Continue (Lv ${(s.bestLevel || 0) + 1})`;
        }
    }
}
showSavedInfo();

// ========== BUNNY ==========
const bunny = {
    x: 0, y: 0, vx: 0, vy: 0, w: 40, h: 44,
    onGround: false, facing: 1, blinkTimer: 0, isBlinking: false,
    invincible: 0, squash: 1, stretch: 1, trail: [],
    doubleJump: true, gliding: false, happyTimer: 0,
};

// ========== INIT ==========
function initBgStars() {
    bgStars = [];
    for (let i = 0; i < 100; i++) bgStars.push({
        x: Math.random(), y: Math.random() * 0.6,
        size: Math.random() * 2.5 + 0.5, twinkle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.5 + 0.2,
    });
}
initBgStars();

function initIslands() {
    floatingIslands = [];
    for (let i = 0; i < 5; i++) floatingIslands.push({
        x: Math.random() * 1200, y: H() * 0.2 + Math.random() * H() * 0.3,
        w: 60 + Math.random() * 80, h: 20 + Math.random() * 15,
        speed: 0.15 + Math.random() * 0.2, trees: Math.floor(Math.random() * 3) + 1,
        hue: Math.random() * 40 + 100,
    });
}

function initGame(continued) {
    cachedSave = null; lastSaveFloor = -1; lastTime = 0;
    const b = bunny;
    b.x = W() * 0.2; b.y = H() * 0.5; b.vx = 0; b.vy = 0;
    b.onGround = false; b.invincible = 0; b.squash = 1; b.stretch = 1;
    b.trail = []; b.doubleJump = true; b.gliding = false; b.happyTimer = 0;

    score = 0; combo = 0; maxCombo = 0; gameTime = 0;
    particles = []; clouds = []; collectibles = [];
    rainbows = []; mushrooms = []; fireflies = [];
    weatherParticles = []; gardenFlowers = [];
    dreamMeter = 0; dreamMode = false; dreamModeTimer = 0;
    totalCollected = 0; bubbleRescue = false;
    energy = 100; maxEnergy = 100; energyRegenTimer = 0; groundDmgCooldown = 0;
    gameOver = false;
    levelTransition = 0; levelTransDir = 0;
    mergeFlash = 0;
    windOffset = 0; windSpeed = 0;
    activePower = null; powerTimer = 0; powerFlash = 0; timeScale = 1;
    wormholeMode = false; whTimer = 0; whPhase = 'coaster'; whScore = 0; whShake = 0;
    rc = { x: 0, y: 0, trackPos: 0, speed: 3, track: [], stars: [], score: 0 };
    nextWormholeScore = 500; currentMusicMode = 'normal';
    frogger = { x: 0, y: 0, lane: 4, hopTimer: 0, facing: 0, alive: true, score: 0 };
    frogLanes = []; frogTimer = 0; frogTransition = 0;
    groundHazards = []; learningGate = null; learningGateTimer = 0; learningReward = false;
    // Restore learning state from save
    const ls = loadSave(); cachedSave = null;
    if (ls.learningState) Object.assign(learningState, ls.learningState);

    if (continued) {
        const s = loadSave();
        currentLevel = Math.min(s.bestLevel || 0, LEVELS.length - 1);
        friends = (s.lastFriends || []).map((f, i) => ({
            x: b.x - (i + 1) * 25, y: b.y, tier: f.tier, typeIdx: f.typeIdx, facing: 1,
        }));
    } else {
        currentLevel = 0;
        friends = [];
    }

    initIslands();

    for (let i = 0; i < 7; i++) clouds.push({
        x: W() * 0.08 + i * (W() / 6),
        y: H() * 0.35 + (i % 3) * (H() * 0.15),
        w: 80 + Math.random() * 50, h: 26 + Math.random() * 12,
        speed: 0.25 + Math.random() * 0.2,
        type: 'normal', bounced: false, hasFace: Math.random() > 0.7,
    });
    for (let i = 0; i < 2; i++) mushrooms.push(makeMushroom(W() * 0.3 + i * W() * 0.35));
    for (let i = 0; i < 10; i++) fireflies.push(makeFirefly());
}

function makeCloud(x) {
    const lv = LEVELS[currentLevel];
    const types = ['normal','normal','normal','normal','spring','golden','rainbow'];
    const bands = [0.25, 0.38, 0.50, 0.62, 0.75];
    const band = bands[Math.floor(Math.random() * bands.length)];
    return {
        x: x ?? W() + 80 + Math.random() * 60,
        y: H() * band + (Math.random() - 0.5) * H() * 0.06,
        w: 80 + Math.random() * 50, h: 26 + Math.random() * 12,
        speed: lv.cloudSpeed * 0.8 + Math.random() * 0.2, // slightly slower for more platform feel
        type: types[Math.floor(Math.random() * types.length)],
        bounced: false, hasFace: Math.random() > 0.72,
    };
}

function makeMushroom(x) {
    const cols = [{c:'#ff6088',c2:'#e04060'},{c:'#8060ff',c2:'#6040d0'},{c:'#60c0ff',c2:'#4090d0'},{c:'#ffb060',c2:'#e09040'}];
    const c = cols[Math.floor(Math.random() * cols.length)];
    return { x: x ?? W() + 30, y: H() * 0.82 + Math.random() * H() * 0.06, speed: 0.3 + Math.random() * 0.2, color: c.c, color2: c.c2, squish: 1 };
}

function makeFirefly() {
    return {
        x: Math.random() * W(), y: Math.random() * H() * 0.7,
        vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.3,
        freq: 2 + Math.random() * 4, phase: Math.random() * Math.PI * 2,
        color: `hsl(${Math.random() * 60 + 40}, 100%, 70%)`,
    };
}

// ========== FRIEND MERGING ==========
function tryMerge() {
    // Count friends by tier and typeIdx
    const counts = {};
    for (const f of friends) {
        const key = `${f.tier}-${f.typeIdx}`;
        counts[key] = (counts[key] || 0) + 1;
    }
    // Find any group of 3
    for (const [key, count] of Object.entries(counts)) {
        if (count >= 3) {
            const [tier, typeIdx] = key.split('-').map(Number);
            const nextTier = tier + 1;
            if (nextTier >= FRIEND_TIERS.length) continue;

            // Remove 3 of this type
            let removed = 0;
            for (let i = friends.length - 1; i >= 0 && removed < 3; i--) {
                if (friends[i].tier === tier && friends[i].typeIdx === typeIdx) {
                    const f = friends[i];
                    spawnParticles(f.x, f.y, FRIEND_TIERS[tier][typeIdx % FRIEND_TIERS[tier].length].color, 10, 4);
                    friends.splice(i, 1);
                    removed++;
                }
            }

            // Add evolved friend
            const newTypeIdx = (nextTier < 3) ? (typeIdx % FRIEND_TIERS[nextTier].length) : 0;
            const evolved = FRIEND_TIERS[nextTier][newTypeIdx];
            friends.push({
                x: bunny.x, y: bunny.y - 30,
                tier: nextTier, typeIdx: newTypeIdx, facing: 1,
            });
            spawnParticles(bunny.x, bunny.y - 30, evolved.glow || '#fff', 20, 6);
            mergeFlash = 1;
            screenShake = 0.4;
            score += (nextTier + 1) * 25;

            // GRANT POWER based on the original animal type!
            const power = POWERS[typeIdx % Object.keys(POWERS).length];
            activePower = { ...power, typeIdx };
            powerTimer = power.duration;
            powerFlash = 1.5;
            if (typeIdx === 3) collectAllOnScreen(); // Earthquake instant effect
            if (typeIdx === 6) timeScale = 0.4; // Time Warp
            spawnTextParticle(bunny.x, bunny.y - 60, `${power.icon} ${power.name}!`, power.color);
            spawnParticles(bunny.x, bunny.y, power.color, 25, 7);
            playCollectSound('power');
            switchMusic('power');

            const s = loadSave();
            s.totalFriendsMerged = (s.totalFriendsMerged || 0) + 1;
            localStorage.setItem('cloudBunny3', JSON.stringify(s));
            cachedSave = null; // invalidate cache
            checkMergeReady();
            return true;
        }
    }
    return false;
}

function checkMergeReady() {
    const counts = {};
    for (const f of friends) {
        const key = `${f.tier}-${f.typeIdx}`;
        counts[key] = (counts[key] || 0) + 1;
    }
    mergeReady = Object.values(counts).some(c => c >= 3);
}

// ========== POWER EFFECTS ==========
function collectAllOnScreen() {
    for (const c of collectibles) {
        score += 10; totalCollected++;
        spawnParticles(c.x, c.y, '#ffe040', 5, 3);
    }
    spawnTextParticle(bunny.x, bunny.y - 50, 'EARTHQUAKE!', '#d0c0a0');
    screenShake = 0.8;
    collectibles = [];
}

function updatePower(dt) {
    if (!activePower) return;
    powerTimer -= dt;
    if (powerFlash > 0) powerFlash -= dt;

    // Magnet: pull collectibles toward bunny
    if (activePower.typeIdx === 2) {
        for (const c of collectibles) {
            const dx = bunny.x - c.x, dy = bunny.y - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 250) { const pull = 0.05 * timeScale; c.x += dx * pull; c.y += dy * pull; }
        }
    }

    // Power expired
    if (powerTimer <= 0) {
        if (activePower.typeIdx === 6) timeScale = 1; // restore time
        spawnTextParticle(bunny.x, bunny.y - 30, 'Power faded...', 'rgba(255,255,255,0.6)');
        activePower = null; powerTimer = 0;
        switchMusic('normal');
    }
}

function drawPowerHUD() {
    if (!activePower) return;
    const pw = 180, ph = 32;
    const px = W()/2 - pw/2, py = H() - 60;
    // Background
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.roundRect(px-4, py-4, pw+8, ph+8, 12); ctx.fill();
    // Power bar
    const fill = Math.max(0, powerTimer / activePower.duration);
    const pg = ctx.createLinearGradient(px, py, px+pw*fill, py);
    pg.addColorStop(0, activePower.color); pg.addColorStop(1, '#fff');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.roundRect(px, py, pw*fill, ph, 8); ctx.fill();
    // Text
    ctx.font = 'bold 14px "Segoe UI"'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText(`${activePower.icon} ${activePower.name} - ${activePower.desc}`, W()/2, py + 21);
    ctx.textAlign = 'left';
    // Screen tint
    if (powerFlash > 0) {
        ctx.fillStyle = `${activePower.color}${Math.floor(powerFlash * 40).toString(16).padStart(2,'0')}`;
        ctx.fillRect(0, 0, W(), H());
    }
}

// ========== ADAPTIVE LEARNING ENGINE ==========
function adaptDifficulty(type) {
    const s = type === 'math' ? learningState : learningState;
    const recent = type === 'math' ? s.recentMath : s.recentLang;
    if (recent.length < 5) return;
    const accuracy = recent.slice(-5).filter(Boolean).length / 5;
    const streak = type === 'math' ? s.mathStreak : s.langStreak;
    const lvl = type === 'math' ? 'mathLevel' : 'langLevel';
    if (accuracy >= 0.8 && streak >= 3) s[lvl] = Math.min(s[lvl] + 1, 5);
    else if (accuracy < 0.4) s[lvl] = Math.max(s[lvl] - 1, 1);
}

function generateMathChallenge() {
    const lvl = learningState.mathLevel;
    let question, answer, hint;
    if (lvl <= 1) { // Counting / simple add
        const a = 1 + Math.floor(Math.random() * 5), b = 1 + Math.floor(Math.random() * 5);
        question = `${a} + ${b}`; answer = a + b; hint = 'Count them up!';
    } else if (lvl === 2) { // Add bigger
        const a = 5 + Math.floor(Math.random() * 15), b = 3 + Math.floor(Math.random() * 10);
        question = `${a} + ${b}`; answer = a + b; hint = 'Add together!';
    } else if (lvl === 3) { // Subtraction
        const a = 10 + Math.floor(Math.random() * 20), b = 1 + Math.floor(Math.random() * a);
        question = `${a} - ${b}`; answer = a - b; hint = 'Take away!';
    } else if (lvl === 4) { // Mix add/sub
        const isAdd = Math.random() > 0.5;
        const a = 5 + Math.floor(Math.random() * 25), b = 2 + Math.floor(Math.random() * (isAdd ? 15 : a));
        question = isAdd ? `${a} + ${b}` : `${a} - ${b}`;
        answer = isAdd ? a + b : a - b; hint = isAdd ? 'Add!' : 'Subtract!';
    } else { // Multiply
        const a = 2 + Math.floor(Math.random() * 8), b = 2 + Math.floor(Math.random() * 8);
        question = `${a} x ${b}`; answer = a * b; hint = 'Multiply!';
    }
    // Generate unique wrong answers
    let opts = [answer];
    while (opts.length < 3) {
        const w = answer + (Math.random() > 0.5 ? 1 : -1) * (1 + Math.floor(Math.random() * 5));
        if (w >= 0 && !opts.includes(w)) opts.push(w);
    }
    opts.sort(() => Math.random() - 0.5);
    return { type: 'math', question: `${question} = ?`, answer, options: opts, hint, selected: -1 };
}

function generateLangChallenge() {
    const lvl = learningState.langLevel;
    if (lvl <= 1) {
        // Letter recognition - which letter comes next?
        const start = Math.floor(Math.random() * 23); // A-W
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const seq = letters[start] + ', ' + letters[start+1] + ', ?';
        const answer = letters[start+2];
        let opts = [answer];
        while (opts.length < 3) { const l = letters[Math.floor(Math.random()*26)]; if (!opts.includes(l)) opts.push(l); }
        opts.sort(() => Math.random() - 0.5);
        return { type: 'lang', question: `Next letter: ${seq}`, answer, options: opts, hint: 'ABC!', selected: -1 };
    } else {
        // Spelling - show word with missing letter(s)
        const bank = WORD_BANKS[Math.min(lvl - 2, WORD_BANKS.length - 1)];
        const word = bank[Math.floor(Math.random() * bank.length)];
        const hideIdx = Math.floor(Math.random() * word.length);
        const display = word.slice(0, hideIdx) + '_' + word.slice(hideIdx + 1);
        const answer = word[hideIdx].toUpperCase();
        let opts = [answer];
        while (opts.length < 3) {
            const l = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)];
            if (!opts.includes(l)) opts.push(l);
        }
        opts.sort(() => Math.random() - 0.5);
        return { type: 'lang', question: `Spell: ${display.toUpperCase()}`, answer, options: opts, hint: `It's a ${word.length}-letter word!`, word, selected: -1 };
    }
}

function triggerLearningGate() {
    // Alternate math and language
    const doMath = Math.random() > 0.4 || learningState.langLevel === 0;
    learningGate = doMath ? generateMathChallenge() : generateLangChallenge();
    learningGateTimer = 0;
}

function answerLearningGate(optionIdx) {
    if (!learningGate || learningGate.selected >= 0) return;
    learningGate.selected = optionIdx;
    const correct = learningGate.options[optionIdx] == learningGate.answer;
    const isMath = learningGate.type === 'math';

    if (isMath) {
        learningState.mathTotal++;
        learningState.recentMath.push(correct);
        if (learningState.recentMath.length > 10) learningState.recentMath.shift();
        if (correct) { learningState.mathCorrect++; learningState.mathStreak++; }
        else learningState.mathStreak = 0;
    } else {
        learningState.langTotal++;
        learningState.recentLang.push(correct);
        if (learningState.recentLang.length > 10) learningState.recentLang.shift();
        if (correct) { learningState.langCorrect++; learningState.langStreak++; }
        else learningState.langStreak = 0;
    }

    if (correct) {
        score += 30; energy = Math.min(maxEnergy, energy + 8);
        spawnParticles(W()/2, H()/2, '#60ff60', 15, 5);
        spawnTextParticle(W()/2, H()/2 - 60, 'Correct! +30', '#60ff60');
        playCollectSound('evolve');
        learningReward = true; // unlock minigame reward
    } else {
        spawnParticles(W()/2, H()/2, '#ff8080', 8, 4);
        const rightAns = learningGate.answer;
        spawnTextParticle(W()/2, H()/2 - 60, `The answer was ${rightAns}`, '#ff8080');
        learningReward = true; // still let them play, but no bonus
    }

    adaptDifficulty(isMath ? 'math' : 'lang');
    // Save learning state
    const sv = loadSave(); cachedSave = null;
    sv.learningState = learningState;
    sv.mathSolved = learningState.mathCorrect;
    localStorage.setItem('cloudBunny3', JSON.stringify(sv));
    checkAchievements();

    // Close gate after 1.5 seconds
    setTimeout(() => { learningGate = null; }, 1500);
}

function drawLearningGate() {
    if (!learningGate) return;
    const g = learningGate;
    const answered = g.selected >= 0;
    const correct = answered && g.options[g.selected] == g.answer;

    // Dim background
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W(), H());

    // Card
    const cw = Math.min(420, W() * 0.85), ch = 200, cx = W()/2 - cw/2, cy = H()/2 - ch/2;
    ctx.fillStyle = 'rgba(20,10,40,0.92)';
    ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 16); ctx.fill();
    ctx.strokeStyle = g.type === 'math' ? '#60a0ff' : '#ff80c0'; ctx.lineWidth = 3; ctx.stroke();

    // Icon + type
    ctx.font = 'bold 16px "Segoe UI"'; ctx.textAlign = 'center';
    ctx.fillStyle = g.type === 'math' ? '#80c0ff' : '#ffa0d0';
    ctx.fillText(g.type === 'math' ? '🧮 Math Challenge' : '📖 Word Challenge', W()/2, cy + 30);

    // Question
    ctx.font = 'bold 28px "Segoe UI"'; ctx.fillStyle = '#fff';
    ctx.fillText(g.question, W()/2, cy + 75);

    // Hint
    ctx.font = '13px "Segoe UI"'; ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText(g.hint, W()/2, cy + 98);

    // Difficulty indicator
    const lvl = g.type === 'math' ? learningState.mathLevel : learningState.langLevel;
    ctx.font = '11px "Segoe UI"'; ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('Level ' + '★'.repeat(lvl) + '☆'.repeat(5 - lvl), W()/2, cy + ch - 15);

    // Options (3 big buttons)
    const btnW = Math.min(100, cw / 4), btnH = 50, btnY = cy + 115;
    for (let i = 0; i < 3; i++) {
        const bx = W()/2 + (i - 1) * (btnW + 15) - btnW/2;
        let bgColor;
        if (!answered) bgColor = 'rgba(255,255,255,0.15)';
        else if (g.options[i] == g.answer) bgColor = 'rgba(60,200,60,0.5)';
        else if (i === g.selected) bgColor = 'rgba(200,60,60,0.5)';
        else bgColor = 'rgba(255,255,255,0.05)';

        ctx.fillStyle = bgColor;
        ctx.beginPath(); ctx.roundRect(bx, btnY, btnW, btnH, 10); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();

        ctx.font = 'bold 22px "Segoe UI"'; ctx.fillStyle = '#fff';
        ctx.fillText(g.options[i], bx + btnW/2, btnY + 33);

        // Key hint
        ctx.font = '11px "Segoe UI"'; ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillText(`Press ${i + 1}`, bx + btnW/2, btnY + btnH + 14);
    }

    // Result feedback
    if (answered) {
        ctx.font = 'bold 24px "Segoe UI"';
        ctx.fillStyle = correct ? '#60ff60' : '#ff8080';
        ctx.fillText(correct ? 'Great job!' : 'Not quite!', W()/2, cy - 15);
    }

    ctx.textAlign = 'left';
}

// ========== WORMHOLE - side-scrolling rollercoaster ==========
function startWormhole() {
    wormholeMode = true; whTimer = 0; whPhase = 'coaster'; whScore = 0; whShake = 0;
    // Generate rollercoaster track - smooth hills and loops
    rc = { x: 0, y: H() * 0.5, trackPos: 0, speed: 3, track: [], stars: [], score: 0 };
    for (let i = 0; i < 300; i++) {
        const hillHeight = Math.sin(i * 0.03) * 150 + Math.sin(i * 0.08) * 80 + Math.cos(i * 0.05) * 60;
        const isLoop = (i > 60 && i < 80) || (i > 160 && i < 180); // loop sections
        rc.track.push({
            x: i * 12,
            y: H() * 0.5 + hillHeight + (isLoop ? Math.sin((i % 20) / 20 * Math.PI * 2) * 120 : 0),
            isLoop,
        });
    }
    // Scatter collectible stars along the track
    for (let i = 0; i < 60; i++) {
        const ti = 10 + Math.floor(Math.random() * 280);
        const tp = rc.track[ti];
        rc.stars.push({ x: tp.x + (Math.random()-0.5)*40, y: tp.y - 40 - Math.random()*60, collected: false });
    }
    const sv = loadSave(); cachedSave = null;
    sv.wormholesEntered = (sv.wormholesEntered || 0) + 1;
    localStorage.setItem('cloudBunny3', JSON.stringify(sv));
    checkAchievements();
    switchMusic('rollercoaster');
}

function updateWormhole(dt) {
    whTimer += dt;
    if (whShake > 0) whShake -= dt * 2;

    if (whPhase === 'coaster') {
        rc.speed = 4 + whTimer * 0.2;
        rc.trackPos += rc.speed * dt * 60;
        // Find current track position
        const idx = Math.floor(rc.trackPos / 12) % rc.track.length;
        const tp = rc.track[Math.min(idx, rc.track.length - 1)];
        rc.x = tp.x; rc.y += (tp.y - rc.y) * 0.12; // smooth follow

        // Collect stars
        for (const s of rc.stars) {
            if (s.collected) continue;
            const dx = (s.x - rc.trackPos) * 0.8, dy = s.y - rc.y;
            if (Math.abs(dx) < 30 && Math.abs(dy) < 40) {
                s.collected = true; whScore += 30; score += 30;
                energy = Math.min(maxEnergy, energy + 3);
                playCollectSound('star');
            }
        }
        // After 12 seconds, trigger learning gate then minigame
        if (whTimer > 12) {
            whPhase = 'learning'; triggerLearningGate();
        }
    } else if (whPhase === 'learning') {
        learningGateTimer += dt;
        // Wait for answer + delay, then go to minigame
        if (!learningGate && learningGateTimer > 0.5) {
            whPhase = pickMinigame(); whTimer = 0;
            if (whPhase === 'frogger') initFrogger();
            else if (whPhase === 'penguin') initPenguin();
            else if (whPhase === 'owl') initOwl();
        }
    } else if (whPhase === 'frogger') { updateFrogger(dt); }
    else if (whPhase === 'penguin') { updatePenguin(dt); }
    else if (whPhase === 'owl') { updateOwl(dt); }

    if (energy <= 0) { energy = 0; endWormhole(); gameOver = true; saveGame(); }
}

function endWormhole() {
    wormholeMode = false;
    nextWormholeScore = score + 400 + currentLevel * 150;
    spawnTextParticle(W()/2, H()/2, `Ride Complete! +${whScore}`, '#ffe080');
    energy = Math.min(maxEnergy, energy + 25);
    switchMusic('normal'); checkAchievements();
}

function pickMinigame() {
    // Pick based on most common friend type
    const counts = {};
    for (const f of friends) counts[f.typeIdx] = (counts[f.typeIdx] || 0) + 1;
    let best = -1, bestCount = 0;
    for (const [k, v] of Object.entries(counts)) if (v > bestCount) { best = parseInt(k); bestCount = v; }
    if (best === 4) return 'frogger';   // frog friends -> frogger
    if (best === 5) return 'penguin';   // penguin friends -> ice slide
    if (best === 7) return 'owl';       // owl friends -> night flight
    return ['frogger','penguin','owl'][Math.floor(Math.random() * 3)];
}

function startWormhole() {
    wormholeMode = true; whTimer = 0; whPhase = 'flying'; whSpeed = 0; whPosition = 0;
    whTilt = 0; whTargetTilt = 0; whScore = 0; whTransition = 0; whBoost = 0; whShake = 0;
    // Player position in the tunnel (actual x,y movement)
    whStars = []; whRings = []; whObstacles = [];
    // Background stars
    for (let i = 0; i < 150; i++) whStars.push({
        x: (Math.random() - 0.5) * 2000, y: (Math.random() - 0.5) * 1500,
        z: 50 + Math.random() * 5000, size: 1 + Math.random() * 2.5, hue: Math.random() * 360,
    });
    // Rings to fly through
    for (let i = 0; i < 40; i++) whRings.push({
        x: (Math.random() - 0.5) * 350, y: (Math.random() - 0.5) * 250,
        z: 300 + i * 200, collected: false, size: 35 + Math.random() * 20,
    });
    // Obstacles
    for (let i = 0; i < 20; i++) whObstacles.push({
        x: (Math.random() - 0.5) * 400, y: (Math.random() - 0.5) * 300,
        z: 500 + i * 400, size: 25 + Math.random() * 35, hit: false,
        rot: Math.random() * Math.PI * 2,
    });
    const s = loadSave(); cachedSave = null;
    s.wormholesEntered = (s.wormholesEntered || 0) + 1;
    localStorage.setItem('cloudBunny3', JSON.stringify(s));
    checkAchievements();
    switchMusic('rollercoaster');
}

function updateWormhole(dt) {
    whTimer += dt;
    if (whShake > 0) whShake -= dt * 2;

    if (whPhase === 'flying') {
        // Smooth acceleration
        whSpeed = Math.min(whSpeed + dt * 3, 10 + whTimer * 0.3);
        whPosition += whSpeed * dt * 50;

        // Full directional control
        const flySpeed = 300;
        if (isLeft()) whTilt = Math.max(whTilt - flySpeed * dt, -W() * 0.35);
        else if (isRight()) whTilt = Math.min(whTilt + flySpeed * dt, W() * 0.35);
        if (keys['ArrowUp'] || keys['KeyW']) whTargetTilt = Math.max(whTargetTilt - flySpeed * dt, -H() * 0.3);
        else if (keys['ArrowDown'] || keys['KeyS']) whTargetTilt = Math.min(whTargetTilt + flySpeed * dt, H() * 0.3);

        // Collect rings
        for (const r of whRings) {
            if (r.collected) continue;
            const rz = r.z - whPosition;
            if (rz > -40 && rz < 80) {
                if (Math.abs(r.x - whTilt * 0.7) < 70 && Math.abs(r.y - whTargetTilt * 0.7) < 60) {
                    r.collected = true; whScore += 50; score += 50;
                    energy = Math.min(maxEnergy, energy + 5);
                    playCollectSound('star');
                }
            }
        }
        // Hit obstacles
        for (const o of whObstacles) {
            if (o.hit) continue; o.rot += dt;
            const oz = o.z - whPosition;
            if (oz > -30 && oz < 60) {
                if (Math.abs(o.x - whTilt * 0.7) < 45 && Math.abs(o.y - whTargetTilt * 0.7) < 40) {
                    o.hit = true; whShake = 0.8;
                    energy = Math.max(0, energy - 8); playCollectSound('hurt');
                }
            }
        }
        // After 10 seconds, transition to minigame
        if (whTimer > 10) {
            whPhase = pickMinigame(); whTimer = 0;
            if (whPhase === 'frogger') initFrogger();
            else if (whPhase === 'penguin') initPenguin();
            else if (whPhase === 'owl') initOwl();
        }
    } else if (whPhase === 'frogger') { updateFrogger(dt); }
    else if (whPhase === 'penguin') { updatePenguin(dt); }
    else if (whPhase === 'owl') { updateOwl(dt); }

    // Check energy during minigames - end wormhole if depleted
    if (energy <= 0) { energy = 0; endWormhole(); gameOver = true; saveGame(); }
}

function endWormhole() {
    wormholeMode = false;
    nextWormholeScore = score + 400 + currentLevel * 150;
    spawnTextParticle(W()/2, H()/2, `Portal Complete! +${whScore}`, '#ffe080');
    energy = Math.min(maxEnergy, energy + 25);
    switchMusic('normal'); checkAchievements();
}

// ========== FROGGER MINIGAME ==========
function initFrogger() {
    const laneH = H() / 9;
    frogger = { x: W()/2, y: H()-laneH*0.5, lane: 8, hopTimer: 0, facing: 0, alive: true, score: 0 };
    frogLanes = [];
    const types = ['goal','water','water','water','safe','road','road','road','start'];
    const speeds = [0, 1.5, -2, 1.8, 0, -2.5, 3, -2, 0];
    const colors = ['#60c060','#3070b0','#2060a0','#3080c0','#a0d0a0','#505050','#404040','#505050','#a0d0a0'];
    for (let i = 0; i < 9; i++) {
        const items = [];
        if (types[i] === 'water') for (let j = 0; j < 4; j++) items.push({ x: j*(W()/3.5)+Math.random()*60, w: 70+Math.random()*50, type: 'log' });
        else if (types[i] === 'road') for (let j = 0; j < 3; j++) items.push({ x: j*(W()/2.8)+Math.random()*80, w: 40+Math.random()*30, type: 'car', color: `hsl(${Math.random()*360},70%,50%)` });
        frogLanes.push({ type: types[i], speed: speeds[i]*(1+currentLevel*0.1), items, color: colors[i], y: i*laneH });
    }
}
function updateFrogger(dt) {
    frogTimer += dt;
    if (!frogger.alive) { frogger.hopTimer += dt; if (frogger.hopTimer > 2) endWormhole(); return; }
    frogger.hopTimer -= dt;
    const laneH = H() / 9;
    for (const lane of frogLanes) for (const item of lane.items) {
        item.x += lane.speed*dt*60;
        if (lane.speed > 0 && item.x > W()+60) item.x = -item.w-20;
        if (lane.speed < 0 && item.x+item.w < -60) item.x = W()+20;
    }
    if (frogger.hopTimer <= 0) {
        let moved = false;
        if (keys['ArrowUp']||keys['KeyW']) { frogger.lane=Math.max(0,frogger.lane-1); moved=true; }
        else if (keys['ArrowDown']||keys['KeyS']) { frogger.lane=Math.min(8,frogger.lane+1); moved=true; }
        else if (keys['ArrowLeft']||keys['KeyA']) { frogger.x=Math.max(20,frogger.x-laneH); moved=true; }
        else if (keys['ArrowRight']||keys['KeyD']) { frogger.x=Math.min(W()-20,frogger.x+laneH); moved=true; }
        if (moved) { frogger.hopTimer=0.18; playCollectSound('flower'); }
    }
    frogger.y += ((frogger.lane*laneH+laneH*0.5)-frogger.y)*0.25;
    const cl = frogLanes[frogger.lane];
    if (cl.type === 'water') {
        let onLog = false;
        for (const item of cl.items) if (frogger.x > item.x-5 && frogger.x < item.x+item.w+5) { onLog=true; frogger.x+=cl.speed*dt*60; break; }
        if (!onLog) { frogger.alive=false; frogger.hopTimer=0; whShake=1; playCollectSound('hurt'); }
    } else if (cl.type === 'road') {
        for (const item of cl.items) if (frogger.x > item.x-15 && frogger.x < item.x+item.w+15) { frogger.alive=false; frogger.hopTimer=0; whShake=1; playCollectSound('hurt'); }
    } else if (cl.type === 'goal' && frogger.lane === 0) {
        whScore+=200; score+=200; energy=Math.min(maxEnergy,energy+15);
        spawnTextParticle(frogger.x, frogger.y, '+200 Safe!', '#60ff60'); playCollectSound('evolve');
        const s=loadSave(); cachedSave=null; s.froggerCrossings=(s.froggerCrossings||0)+1;
        localStorage.setItem('cloudBunny3',JSON.stringify(s)); checkAchievements();
        frogger.lane=8; frogger.x=W()/2;
    }
    frogger.x=Math.max(0,Math.min(W(),frogger.x));
    if (frogTimer > 20) endWormhole();
}

// ========== PENGUIN ICE SLIDE ==========
function initPenguin() {
    penguinGame = { x: W()/2, y: H()*0.7, vx: 0, vy: 0, fish: [], icebergs: [], score: 0, timer: 0 };
    for (let i = 0; i < 20; i++) penguinGame.fish.push({
        x: Math.random()*W(), y: Math.random()*H()*0.6+H()*0.1, collected: false,
    });
    for (let i = 0; i < 8; i++) penguinGame.icebergs.push({
        x: Math.random()*W(), y: Math.random()*H()*0.5+H()*0.15, w: 50+Math.random()*60, h: 30+Math.random()*20,
    });
}
function updatePenguin(dt) {
    const pg = penguinGame; pg.timer += dt;
    // Slide physics (ice = low friction)
    if (isLeft()) pg.vx -= 400*dt; if (isRight()) pg.vx += 400*dt;
    if (keys['ArrowUp']||keys['KeyW']) pg.vy -= 400*dt;
    if (keys['ArrowDown']||keys['KeyS']) pg.vy += 400*dt;
    pg.vx *= 0.98; pg.vy *= 0.98; // ice friction
    pg.x += pg.vx*dt; pg.y += pg.vy*dt;
    pg.x = Math.max(20, Math.min(W()-20, pg.x));
    pg.y = Math.max(20, Math.min(H()-20, pg.y));
    // Collect fish
    for (const f of pg.fish) {
        if (f.collected) continue;
        if (Math.hypot(pg.x-f.x, pg.y-f.y) < 25) {
            f.collected=true; pg.score+=30; whScore+=30; score+=30;
            energy=Math.min(maxEnergy,energy+3); playCollectSound('star');
            const s=loadSave(); cachedSave=null; s.fishCollected=(s.fishCollected||0)+1;
            localStorage.setItem('cloudBunny3',JSON.stringify(s)); checkAchievements();
        }
    }
    // Bounce off icebergs
    for (const ib of pg.icebergs) {
        if (pg.x > ib.x-ib.w/2-15 && pg.x < ib.x+ib.w/2+15 && pg.y > ib.y-ib.h/2-15 && pg.y < ib.y+ib.h/2+15) {
            pg.vx *= -0.8; pg.vy *= -0.8;
            pg.x += pg.vx*dt*3; pg.y += pg.vy*dt*3;
        }
    }
    if (pg.timer > 18) endWormhole();
}

// ========== OWL NIGHT FLIGHT ==========
function initOwl() {
    owlGame = { x: W()*0.3, y: H()/2, vy: 0, trees: [], fireflies: [], score: 0, timer: 0, flap: 0 };
    for (let i = 0; i < 10; i++) owlGame.trees.push({
        x: W()+i*200+Math.random()*80, gapY: H()*0.2+Math.random()*H()*0.5, gapH: 120+Math.random()*40, passed: false,
    });
    for (let i = 0; i < 15; i++) owlGame.fireflies.push({
        x: W()+Math.random()*2000, y: Math.random()*H(), collected: false,
    });
}
function updateOwl(dt) {
    const og = owlGame; og.timer += dt;
    // Flappy bird style
    og.vy += 500*dt; // gravity
    if (wantsJump() && og.flap <= 0) { og.vy = -200; og.flap = 0.15; playCollectSound('flower'); }
    if (og.flap > 0) og.flap -= dt;
    og.y += og.vy*dt;
    og.y = Math.max(15, Math.min(H()-15, og.y));
    const scrollSpeed = 150 + og.timer * 3;
    // Trees (obstacles)
    for (const t of og.trees) {
        t.x -= scrollSpeed*dt;
        if (t.x < -50) { t.x = W()+100+Math.random()*100; t.gapY = H()*0.2+Math.random()*H()*0.5; t.passed=false; }
        if (!t.passed && t.x < og.x) { t.passed=true; og.score+=20; whScore+=20; score+=20; }
        // Collision
        if (og.x > t.x-20 && og.x < t.x+20) {
            if (og.y < t.gapY-t.gapH/2 || og.y > t.gapY+t.gapH/2) {
                whShake=0.5; energy=Math.max(0,energy-10); og.y = og.y < t.gapY ? t.gapY-t.gapH/2+10 : t.gapY+t.gapH/2-10;
                og.vy = 0; playCollectSound('hurt');
            }
        }
    }
    for (const ff of og.fireflies) {
        ff.x -= scrollSpeed*dt*0.8;
        if (ff.x < -20) { ff.x = W()+Math.random()*500; ff.y = Math.random()*H(); ff.collected=false; }
        if (!ff.collected && Math.hypot(og.x-ff.x, og.y-ff.y) < 25) {
            ff.collected=true; og.score+=15; whScore+=15; score+=15;
            energy=Math.min(maxEnergy,energy+2); playCollectSound('star');
        }
    }
    if (og.timer > 18) endWormhole();
}

// ========== MINIGAME DRAWING ==========
function drawWormhole() {
    if (whPhase === 'learning') { drawLearningGate(); drawMinigameEnergyBar(); return; }
    if (whPhase === 'frogger') { drawFrogger(); return; }
    if (whPhase === 'penguin') { drawPenguin(); return; }
    if (whPhase === 'owl') { drawOwl(); return; }

    // Side-scrolling rollercoaster ride!
    const t = whTimer;
    ctx.save();

    // Sunset sky
    const sg = ctx.createLinearGradient(0, 0, 0, H());
    sg.addColorStop(0, '#2a1a4e'); sg.addColorStop(0.3, '#6a3070');
    sg.addColorStop(0.6, '#e07888'); sg.addColorStop(1, '#ffb868');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W(), H());

    // Background clouds
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < 6; i++) {
        const cx = ((i * 250 - rc.trackPos * 0.1 + 2000) % (W() + 300)) - 100;
        const cy = H() * 0.15 + i * 30 + Math.sin(t + i) * 10;
        ctx.fillStyle = '#e8c0d0';
        ctx.beginPath(); ctx.ellipse(cx, cy, 60, 20, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx - 30, cy + 5, 35, 15, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx + 35, cy + 5, 40, 15, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Draw track rails
    const viewOffset = rc.trackPos;
    ctx.save();
    ctx.translate(-viewOffset % 12, 0);

    // Track supports (vertical lines from track to ground)
    ctx.strokeStyle = 'rgba(100,80,60,0.5)'; ctx.lineWidth = 3;
    for (let i = 0; i < rc.track.length; i += 5) {
        const tx = rc.track[i].x - viewOffset;
        if (tx < -50 || tx > W() + 50) continue;
        const ty = rc.track[i].y;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx, H()); ctx.stroke();
    }

    // Track rail (thick colored line following the hills)
    ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // Shadow rail
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 8;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < rc.track.length; i++) {
        const tx = rc.track[i].x - viewOffset;
        if (tx < -50 || tx > W() + 50) { started = false; continue; }
        if (!started) { ctx.moveTo(tx, rc.track[i].y + 4); started = true; }
        else ctx.lineTo(tx, rc.track[i].y + 4);
    }
    ctx.stroke();
    // Main rail
    const railGrad = ctx.createLinearGradient(0, 0, W(), 0);
    railGrad.addColorStop(0, '#8060a0'); railGrad.addColorStop(0.5, '#c080c0'); railGrad.addColorStop(1, '#8060a0');
    ctx.strokeStyle = railGrad; ctx.lineWidth = 5;
    ctx.beginPath(); started = false;
    for (let i = 0; i < rc.track.length; i++) {
        const tx = rc.track[i].x - viewOffset;
        if (tx < -50 || tx > W() + 50) { started = false; continue; }
        if (!started) { ctx.moveTo(tx, rc.track[i].y); started = true; }
        else ctx.lineTo(tx, rc.track[i].y);
    }
    ctx.stroke();

    // Collectible stars along the track
    for (const s of rc.stars) {
        if (s.collected) continue;
        const sx = s.x - viewOffset;
        if (sx < -30 || sx > W() + 30) continue;
        // Spinning star
        ctx.save(); ctx.translate(sx, s.y);
        ctx.rotate(t * 3); const pulse = 1 + Math.sin(t * 5 + s.x) * 0.15;
        ctx.scale(pulse, pulse);
        ctx.fillStyle = '#ffe040';
        ctx.beginPath();
        for (let v = 0; v < 5; v++) {
            const a = (v * 4 * Math.PI) / 5 - Math.PI / 2;
            ctx.lineTo(Math.cos(a) * 10, Math.sin(a) * 10);
            ctx.lineTo(Math.cos(a + Math.PI/5) * 4, Math.sin(a + Math.PI/5) * 4);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
    }

    // Bunny in a cart on the track!
    const cartIdx = Math.floor(rc.trackPos / 12) % rc.track.length;
    const cartTp = rc.track[Math.min(cartIdx, rc.track.length - 1)];
    const nextTp = rc.track[Math.min(cartIdx + 1, rc.track.length - 1)];
    const cartAngle = Math.atan2(nextTp.y - cartTp.y, 12); // slope angle
    const cartX = cartTp.x - viewOffset;
    const cartY = rc.y;

    ctx.save();
    ctx.translate(cartX, cartY);
    ctx.rotate(cartAngle * 0.5);

    // Cart
    ctx.fillStyle = '#c080ff';
    ctx.beginPath(); ctx.roundRect(-18, -8, 36, 16, 5); ctx.fill();
    ctx.strokeStyle = '#8040c0'; ctx.lineWidth = 2; ctx.stroke();
    // Wheels
    ctx.fillStyle = '#666';
    ctx.beginPath(); ctx.arc(-12, 10, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, 10, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5; ctx.stroke();

    // Bunny sitting in the cart
    ctx.fillStyle = '#ffe8f0';
    ctx.beginPath(); ctx.ellipse(0, -16, 14, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#e8a0b8'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#fff0f5';
    ctx.beginPath(); ctx.ellipse(0, -28, 11, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Ears
    for (let s of [-1, 1]) {
        ctx.save(); ctx.translate(s * 6, -36);
        ctx.rotate(s * 0.2 + Math.sin(t * 6) * 0.3 * s + cartAngle * 0.5 * s);
        ctx.fillStyle = '#ffe8f0';
        ctx.beginPath(); ctx.ellipse(0, -10, 4, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb0c8';
        ctx.beginPath(); ctx.ellipse(0, -9, 2, 8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
    // Eyes
    for (let s of [-1, 1]) {
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * 5, -30, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4a2040'; ctx.beginPath(); ctx.arc(s * 5, -30, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * 5 + 1, -31, 1, 0, Math.PI * 2); ctx.fill();
    }
    // Smile
    ctx.strokeStyle = '#c07090'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, -26, 3, 0.1, Math.PI - 0.1); ctx.stroke();
    // Arms up (excited!)
    ctx.strokeStyle = '#ffe0ea'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12, -18); ctx.lineTo(-20, -35 + Math.sin(t * 8) * 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -18); ctx.lineTo(20, -35 + Math.cos(t * 8) * 5); ctx.stroke();

    ctx.restore();
    ctx.restore();

    // HUD
    ctx.font = 'bold 22px "Segoe UI"'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4;
    ctx.fillText('Rainbow Rollercoaster!', W()/2, 35);
    ctx.font = '15px "Segoe UI"'; ctx.fillStyle = '#ffe080';
    ctx.fillText(`+${whScore} pts | Stars: ${rc.stars.filter(s=>s.collected).length}/${rc.stars.length} | ${Math.ceil(Math.max(0, 12 - whTimer))}s`, W()/2, 58);
    ctx.shadowBlur = 0;
    drawMinigameEnergyBar();
    ctx.textAlign = 'left';
    ctx.restore();
}

function drawMinigameEnergyBar() {
    const bw = 100, bh = 8, bx = W() - bw - 15, by = 15;
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.roundRect(bx-2,by-2,bw+4,bh+4,6); ctx.fill();
    const fill = Math.max(0, energy / maxEnergy);
    if (fill > 0) {
        ctx.fillStyle = fill > 0.5 ? '#60dd60' : fill > 0.25 ? '#ddcc40' : '#dd4040';
        ctx.beginPath(); ctx.roundRect(bx,by,bw*fill,bh,4); ctx.fill();
    }
    ctx.font = '9px "Segoe UI"'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText(`Energy ${Math.ceil(energy)}`, bx+bw/2, by+bh+11);
    if (energy < 20) { ctx.globalAlpha = 0.08 + Math.sin(gameTime*6)*0.05; ctx.fillStyle='#ff0000'; ctx.fillRect(0,0,W(),H()); ctx.globalAlpha=1; }
}

function drawFrogger() {
    ctx.save();
    if (whShake>0) ctx.translate((Math.random()-0.5)*whShake*12,(Math.random()-0.5)*whShake*12);
    const laneH = H()/9;
    for (let i=0;i<9;i++) {
        const lane=frogLanes[i]; ctx.fillStyle=lane.color; ctx.fillRect(0,lane.y,W(),laneH);
        if (lane.type==='road') { ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2; ctx.setLineDash([20,15]); ctx.beginPath(); ctx.moveTo(0,lane.y); ctx.lineTo(W(),lane.y); ctx.stroke(); ctx.setLineDash([]); }
        if (lane.type==='goal') { ctx.font='bold 16px "Segoe UI"'; ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.textAlign='center'; ctx.fillText('SAFE ZONE',W()/2,lane.y+laneH*0.65); ctx.textAlign='left'; }
        for (const item of lane.items) {
            if (item.type==='log') { ctx.fillStyle='#8B6914'; ctx.beginPath(); ctx.roundRect(item.x,lane.y+laneH*0.2,item.w,laneH*0.6,6); ctx.fill(); }
            else if (item.type==='car') {
                ctx.fillStyle=item.color; ctx.beginPath(); ctx.roundRect(item.x,lane.y+laneH*0.15,item.w,laneH*0.7,5); ctx.fill();
                ctx.fillStyle='rgba(150,200,255,0.6)'; ctx.beginPath(); ctx.roundRect(lane.speed>0?item.x+item.w*0.65:item.x+item.w*0.1,lane.y+laneH*0.22,item.w*0.25,laneH*0.4,2); ctx.fill();
            }
        }
    }
    // Frog
    ctx.save(); ctx.translate(frogger.x, frogger.y);
    if (!frogger.alive) { ctx.rotate(frogger.hopTimer*10); ctx.globalAlpha=1-frogger.hopTimer/2; }
    ctx.fillStyle='#40c040'; ctx.beginPath(); ctx.ellipse(0,0,16,14,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#208020'; ctx.lineWidth=1.5; ctx.stroke();
    for (let s of [-1,1]) { ctx.fillStyle='#e0ffe0'; ctx.beginPath(); ctx.arc(s*10,-10,7,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#204020'; ctx.beginPath(); ctx.arc(s*10,-10,4,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s*10+1,-12,1.5,0,Math.PI*2); ctx.fill(); }
    ctx.strokeStyle='#208020'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,-4,5,0.2,Math.PI-0.2); ctx.stroke();
    // Bunny ears on frog
    for (let s of [-1,1]) { ctx.fillStyle='#80e080'; ctx.beginPath(); ctx.ellipse(s*6,-18,3,7,s*0.2,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffb0c8'; ctx.beginPath(); ctx.ellipse(s*6,-17,1.5,4,s*0.2,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
    // HUD
    ctx.font='bold 20px "Segoe UI"'; ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=4;
    ctx.fillText('Frogger! Cross to safety!',W()/2,28);
    ctx.font='14px "Segoe UI"'; ctx.fillStyle='#ffe080';
    ctx.fillText(`+${whScore} pts | ${Math.ceil(20-frogTimer)}s`,W()/2,48);
    ctx.shadowBlur=0; drawMinigameEnergyBar(); ctx.textAlign='left'; ctx.restore();
}

function drawPenguin() {
    ctx.save();
    const pg = penguinGame;
    // Ice background
    const ig = ctx.createLinearGradient(0,0,0,H());
    ig.addColorStop(0,'#b0d8f0'); ig.addColorStop(1,'#e0f0ff');
    ctx.fillStyle=ig; ctx.fillRect(0,0,W(),H());
    // Ice texture (pre-baked)
    if (!penguinGame._iceTex || penguinGame._iceTex.width !== W()) {
        const oc = document.createElement('canvas'); oc.width = W(); oc.height = H();
        const ox = oc.getContext('2d'); ox.strokeStyle='#fff'; ox.lineWidth=0.5; ox.globalAlpha=0.1;
        for (let x=0;x<W();x+=40) for (let y=0;y<H();y+=40) {
            ox.beginPath(); ox.moveTo(x+Math.random()*20,y); ox.lineTo(x+20+Math.random()*20,y+20); ox.stroke();
        }
        penguinGame._iceTex = oc;
    }
    ctx.drawImage(penguinGame._iceTex, 0, 0);
    // Icebergs
    for (const ib of pg.icebergs) {
        ctx.fillStyle='#d0e8f8'; ctx.beginPath(); ctx.roundRect(ib.x-ib.w/2,ib.y-ib.h/2,ib.w,ib.h,8); ctx.fill();
        ctx.strokeStyle='#a0c0d8'; ctx.lineWidth=2; ctx.stroke();
    }
    // Fish
    for (const f of pg.fish) {
        if (f.collected) continue;
        ctx.save(); ctx.translate(f.x, f.y);
        ctx.fillStyle='#ff8040'; ctx.beginPath(); ctx.ellipse(0,0,10,6,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ff6020'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(16,-5); ctx.lineTo(16,5); ctx.fill();
        ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(-4,-2,2,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }
    // Penguin (transformed bunny!)
    ctx.save(); ctx.translate(pg.x, pg.y);
    const slide = Math.abs(pg.vx) > 50;
    if (slide) ctx.rotate(pg.vx > 0 ? 0.3 : -0.3);
    ctx.fillStyle='#2050a0'; ctx.beginPath(); ctx.ellipse(0,0,16,20,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,3,10,14,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2050a0'; ctx.beginPath(); ctx.ellipse(0,-12,12,10,0,0,Math.PI*2); ctx.fill();
    for (let s of [-1,1]) { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s*5,-13,4,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(s*5,-13,2.5,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle='#ff8020'; ctx.beginPath(); ctx.ellipse(0,-8,4,2,0,0,Math.PI*2); ctx.fill();
    // Bunny ears!
    for (let s of [-1,1]) { ctx.fillStyle='#3060b0'; ctx.beginPath(); ctx.ellipse(s*5,-22,3,6,s*0.2,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffb0c8'; ctx.beginPath(); ctx.ellipse(s*5,-21,1.5,3.5,s*0.2,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
    // HUD
    ctx.font='bold 20px "Segoe UI"'; ctx.fillStyle='#2050a0'; ctx.textAlign='center';
    ctx.fillText('Penguin Slide! Collect the fish!',W()/2,28);
    ctx.font='14px "Segoe UI"'; ctx.fillStyle='#4080c0';
    ctx.fillText(`+${whScore} pts | ${Math.ceil(18-pg.timer)}s | Fish: ${pg.fish.filter(f=>f.collected).length}/${pg.fish.length}`,W()/2,48);
    drawMinigameEnergyBar(); ctx.textAlign='left'; ctx.restore();
}

function drawOwl() {
    ctx.save();
    const og = owlGame;
    // Dark forest background
    const bg = ctx.createLinearGradient(0,0,0,H());
    bg.addColorStop(0,'#0a0a20'); bg.addColorStop(0.6,'#101830'); bg.addColorStop(1,'#0a1018');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W(),H());
    // Moon
    ctx.fillStyle='#ffe8c0'; ctx.globalAlpha=0.8;
    ctx.beginPath(); ctx.arc(W()*0.8,H()*0.15,40,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    // Trees (obstacles with gaps)
    for (const t of og.trees) {
        ctx.fillStyle='#1a3020';
        ctx.fillRect(t.x-15, 0, 30, t.gapY-t.gapH/2);
        ctx.fillRect(t.x-15, t.gapY+t.gapH/2, 30, H()-t.gapY-t.gapH/2);
        // Leaves
        ctx.fillStyle='#2a5030';
        ctx.beginPath(); ctx.ellipse(t.x,t.gapY-t.gapH/2,25,15,0,Math.PI,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(t.x,t.gapY+t.gapH/2,25,15,0,0,Math.PI); ctx.fill();
    }
    // Fireflies
    for (const ff of og.fireflies) {
        if (ff.collected) continue;
        const glow = 0.5+Math.sin(gameTime*4+ff.x)*0.3;
        ctx.globalAlpha=glow;
        const fg=ctx.createRadialGradient(ff.x,ff.y,0,ff.x,ff.y,10);
        fg.addColorStop(0,'#ffe060'); fg.addColorStop(1,'transparent');
        ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(ff.x,ff.y,10,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1; ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(ff.x,ff.y,2,0,Math.PI*2); ctx.fill();
    }
    // Owl (transformed bunny!)
    ctx.save(); ctx.translate(og.x, og.y);
    const wingFlap = Math.sin(gameTime*8)*0.3;
    ctx.fillStyle='#8B6914'; ctx.beginPath(); ctx.ellipse(0,0,16,18,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#a08040'; ctx.beginPath(); ctx.ellipse(0,-10,14,12,0,0,Math.PI*2); ctx.fill();
    // Big owl eyes
    for (let s of [-1,1]) { ctx.fillStyle='#ffe8a0'; ctx.beginPath(); ctx.arc(s*6,-12,6,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(s*6,-12,3.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s*6+1,-13,1.2,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle='#ff8020'; ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(-3,-4); ctx.lineTo(3,-4); ctx.fill();
    // Wings
    for (let s of [-1,1]) { ctx.save(); ctx.rotate(wingFlap*s);
        ctx.fillStyle='#7a5810'; ctx.beginPath(); ctx.ellipse(s*18,-2,12,8,s*0.5,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    // Bunny ears
    for (let s of [-1,1]) { ctx.fillStyle='#a08040'; ctx.beginPath(); ctx.ellipse(s*5,-20,3,7,s*0.2,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffb0c8'; ctx.beginPath(); ctx.ellipse(s*5,-19,1.5,4,s*0.2,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
    // HUD
    ctx.font='bold 20px "Segoe UI"'; ctx.fillStyle='#ffe8a0'; ctx.textAlign='center';
    ctx.fillText('Night Owl! Fly through the forest!',W()/2,28);
    ctx.font='14px "Segoe UI"'; ctx.fillStyle='#c0a060';
    ctx.fillText(`+${whScore} pts | ${Math.ceil(18-og.timer)}s | Space to flap!`,W()/2,48);
    drawMinigameEnergyBar(); ctx.textAlign='left'; ctx.restore();
}

// ========== ACHIEVEMENTS ==========
function checkAchievements() {
    cachedSave = null; // ensure fresh data for save-based achievement checks
    for (const a of ACHIEVEMENTS) {
        if (unlockedAchievements.includes(a.id)) continue;
        if (a.check()) {
            unlockedAchievements.push(a.id);
            achievementPopup = a; achievementPopupTimer = 4;
            spawnParticles(W()/2, 80, '#ffe040', 15, 5);
            playCollectSound('evolve');
            // Save
            const s = loadSave(); cachedSave = null;
            s.achievements = unlockedAchievements;
            localStorage.setItem('cloudBunny3', JSON.stringify(s));
        }
    }
}
function loadAchievements() {
    const s = loadSave();
    unlockedAchievements = s.achievements || [];
}
function drawAchievementPopup() {
    if (!achievementPopup || achievementPopupTimer <= 0) return;
    // Timer decremented in update() with proper dt
    const alpha = Math.min(1, achievementPopupTimer, (4-achievementPopupTimer)*3);
    ctx.globalAlpha = alpha;
    const pw = 280, ph = 50, px = W()/2-pw/2, py = 90;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.beginPath(); ctx.roundRect(px,py,pw,ph,12); ctx.fill();
    ctx.strokeStyle = '#ffe040'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = 'bold 16px "Segoe UI"'; ctx.fillStyle = '#ffe040'; ctx.textAlign = 'center';
    ctx.fillText(`${achievementPopup.icon} Achievement: ${achievementPopup.name}`, W()/2, py+22);
    ctx.font = '12px "Segoe UI"'; ctx.fillStyle = '#fff';
    ctx.fillText(achievementPopup.desc, W()/2, py+40);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
}

// ========== WEATHER SYSTEM ==========
function updateWeather(dt) {
    const lv = LEVELS[currentLevel];
    const w = lv.weather;

    // Wind
    if (w === 'breeze' || w === 'rain') {
        windSpeed += (Math.sin(gameTime * 0.3) * 0.5 - windSpeed) * 0.01;
        windOffset += windSpeed;
    } else {
        windSpeed *= 0.95;
    }

    // Spawn weather particles
    if (w === 'rain') {
        for (let i = 0; i < 3; i++) {
            weatherParticles.push({
                x: Math.random() * W() * 1.3 - W() * 0.15,
                y: -10 - Math.random() * 30,
                vx: windSpeed * 3 - 0.5, vy: 6 + Math.random() * 4,
                life: 1, size: 2 + Math.random() * 2, type: 'rain',
            });
        }
    } else if (w === 'snow') {
        if (Math.random() < 0.3) {
            weatherParticles.push({
                x: Math.random() * W() * 1.2 - W() * 0.1,
                y: -10,
                vx: (Math.random() - 0.5) * 0.8, vy: 0.8 + Math.random() * 1.2,
                life: 1, size: 2 + Math.random() * 3, type: 'snow',
                wobble: Math.random() * Math.PI * 2,
            });
        }
    } else if (w === 'breeze') {
        if (Math.random() < 0.04) {
            weatherParticles.push({
                x: -20, y: Math.random() * H() * 0.7,
                vx: 1.5 + Math.random(), vy: (Math.random() - 0.5) * 0.3,
                life: 1, size: 3 + Math.random() * 3, type: 'leaf',
                rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 3,
                color: Math.random() > 0.5 ? '#80c040' : '#a0d060',
            });
        }
    }

    // Update weather particles
    for (let i = weatherParticles.length - 1; i >= 0; i--) {
        const p = weatherParticles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.type === 'snow') {
            p.x += Math.sin(gameTime * 2 + p.wobble) * 0.3;
        }
        if (p.type === 'leaf') { p.rot += p.rotSpeed * dt; p.life -= 0.003; }
        if (p.y > H() + 20 || p.x > W() + 40 || p.life <= 0) weatherParticles.splice(i, 1);
    }

    // Cap weather particles
    if (weatherParticles.length > 200) weatherParticles.splice(0, weatherParticles.length - 200);
}

function drawWeather() {
    const lv = LEVELS[currentLevel];
    const w = lv.weather;

    // Aurora
    if (w === 'aurora' || w === 'dream' || w === 'cosmic') {
        ctx.globalAlpha = 0.2;
        for (let band = 0; band < 3; band++) {
            const hue = (gameTime * 15 + band * 50) % 360;
            ctx.strokeStyle = `hsla(${hue}, 70%, 60%, 0.5)`;
            ctx.lineWidth = 18 + band * 8;
            ctx.beginPath();
            for (let x = 0; x <= W(); x += 20) {
                const y = H() * 0.12 + band * 22 + Math.sin(x * 0.005 + gameTime * 0.3 + band) * 28 + Math.sin(x * 0.012 + gameTime * 0.7) * 12;
                x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    // Cosmic stars
    if (w === 'cosmic' || w === 'dream') {
        for (let i = 0; i < 8; i++) {
            const sx = ((gameTime * 20 + i * 137) % (W() + 40)) - 20;
            const sy = ((i * 97 + Math.sin(gameTime + i) * 30) % (H() * 0.5));
            ctx.globalAlpha = 0.3 + Math.sin(gameTime * 3 + i) * 0.2;
            ctx.fillStyle = `hsl(${(i * 45 + gameTime * 10) % 360}, 80%, 75%)`;
            ctx.beginPath();
            ctx.arc(sx, sy, 1.5 + Math.sin(gameTime * 4 + i) * 0.8, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // Weather particles
    for (const p of weatherParticles) {
        ctx.globalAlpha = Math.min(p.life, 0.7);
        if (p.type === 'rain') {
            ctx.strokeStyle = 'rgba(150,180,220,0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.vx * 2, p.y + p.vy * 2);
            ctx.stroke();
        } else if (p.type === 'snow') {
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
            ctx.fill();
        } else if (p.type === 'leaf') {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size, p.size * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
    ctx.globalAlpha = 1;

    // Rain splash on bunny
    if (w === 'rain' && Math.random() < 0.02 && bunny.invincible <= 0) {
        // Gentle rain doesn't hurt, just looks nice
        spawnParticles(bunny.x + (Math.random()-0.5)*20, bunny.y - 10, 'rgba(150,180,220,0.5)', 2, 1.5);
    }
}

// ========== DRAWING ==========
function drawBackground() {
    const lv = LEVELS[currentLevel];
    const sc = lv.skyColors;
    const g = ctx.createLinearGradient(0, 0, 0, H());
    g.addColorStop(0, sc[0]); g.addColorStop(0.5, sc[1]); g.addColorStop(1, sc[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W(), H());

    // Stars
    const isDark = ['aurora','cosmic','dream','fireflies'].includes(lv.weather) || currentLevel >= 2;
    const starA = isDark ? 0.6 : 0.08;
    for (const s of bgStars) {
        const tw = Math.sin(gameTime * s.speed * 2 + s.twinkle);
        ctx.globalAlpha = starA * (0.3 + tw * 0.4);
        ctx.fillStyle = lv.weather === 'cosmic' ? `hsl(${(s.x * 360 + gameTime * 20) % 360}, 80%, 80%)` : '#fff';
        ctx.beginPath();
        ctx.arc(s.x * W(), s.y * H(), s.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Floating islands
    for (const isle of floatingIslands) {
        isle.x -= isle.speed;
        if (isle.x < -150) isle.x = W() + 100 + Math.random() * 200;
        ctx.save();
        ctx.globalAlpha = 0.25;
        ctx.translate(isle.x, isle.y + Math.sin(gameTime + isle.x * 0.01) * 5);
        ctx.fillStyle = `hsl(${isle.hue}, 30%, 35%)`;
        ctx.beginPath(); ctx.ellipse(0, 0, isle.w * 0.5, isle.h * 0.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = `hsl(${isle.hue}, 50%, 45%)`;
        ctx.beginPath(); ctx.ellipse(0, -isle.h * 0.2, isle.w * 0.5, isle.h * 0.25, 0, Math.PI, Math.PI * 2); ctx.fill();
        for (let t = 0; t < isle.trees; t++) {
            const tx = (t - (isle.trees - 1) / 2) * 18;
            ctx.fillStyle = `hsl(${isle.hue + 20}, 40%, 30%)`;
            ctx.beginPath(); ctx.moveTo(tx, -isle.h * 0.3); ctx.lineTo(tx - 7, -isle.h * 0.3 - 16); ctx.lineTo(tx + 7, -isle.h * 0.3 - 16); ctx.fill();
        }
        ctx.restore();
    }

    // Hills
    ctx.fillStyle = `rgba(${isDark ? '80,50,120' : '180,160,220'}, 0.15)`;
    ctx.beginPath(); ctx.moveTo(0, H());
    for (let x = 0; x <= W(); x += 18) ctx.lineTo(x, H() * 0.78 + Math.sin(x * 0.006 + gameTime * 0.1) * 32);
    ctx.lineTo(W(), H()); ctx.fill();

    // Meadow
    const mG = ctx.createLinearGradient(0, H() * 0.88, 0, H());
    const isSnow = lv.weather === 'snow';
    mG.addColorStop(0, isDark ? 'rgba(60,30,80,0.5)' : isSnow ? 'rgba(220,230,240,0.6)' : 'rgba(120,200,120,0.4)');
    mG.addColorStop(1, isDark ? 'rgba(40,20,60,0.7)' : isSnow ? 'rgba(240,245,250,0.8)' : 'rgba(80,160,80,0.6)');
    ctx.fillStyle = mG;
    ctx.beginPath(); ctx.moveTo(0, H());
    for (let x = 0; x <= W(); x += 12) ctx.lineTo(x, H() * 0.9 + Math.sin(x * 0.02 + gameTime * 0.5) * 4);
    ctx.lineTo(W(), H()); ctx.fill();

    // Meadow flowers
    if (!isSnow) {
        for (let x = 8; x < W(); x += 38) {
            const fy = H() * 0.9 + Math.sin(x * 0.02 + gameTime * 0.5) * 4 - 4;
            ctx.fillStyle = `hsla(${(x * 3 + gameTime * 10) % 360}, 65%, 68%, 0.45)`;
            ctx.beginPath(); ctx.arc(x, fy, 2.2, 0, Math.PI * 2); ctx.fill();
        }
    }
}

function drawBunny() {
    const b = bunny;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.facing * b.squash, b.stretch);

    if (b.happyTimer > 0) {
        for (let i = 0; i < 3; i++) {
            const a = gameTime * 5 + i * 2.1, d = 25 + Math.sin(gameTime * 8 + i) * 5;
            ctx.fillStyle = `hsla(${(gameTime * 100 + i * 60) % 360}, 100%, 75%, ${b.happyTimer})`;
            ctx.beginPath(); ctx.arc(Math.cos(a) * d, Math.sin(a) * d - 5, 3, 0, Math.PI * 2); ctx.fill();
        }
    }
    if (b.gliding) {
        ctx.fillStyle = 'rgba(180,140,255,0.3)';
        ctx.beginPath(); ctx.moveTo(-5, 0); ctx.quadraticCurveTo(-30, 15, -20, 28);
        ctx.lineTo(20, 28); ctx.quadraticCurveTo(30, 15, 5, 0); ctx.fill();
    }
    if (dreamMode) {
        const as = 35 + Math.sin(gameTime * 4) * 5;
        const ag = ctx.createRadialGradient(0, 0, 10, 0, 0, as);
        ag.addColorStop(0, 'rgba(255,200,255,0.3)'); ag.addColorStop(1, 'rgba(180,100,255,0)');
        ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, 0, as, 0, Math.PI * 2); ctx.fill();
    }
    if (b.invincible > 0 && Math.floor(b.invincible * 10) % 2 === 0) ctx.globalAlpha = 0.5;

    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath(); ctx.ellipse(0, b.h / 2 + 2, b.w * 0.45, 3, 0, 0, Math.PI * 2); ctx.fill();

    const dm = dreamMode;
    const cacheKey = dm ? 'dream' : 'normal';
    if (!bunny._gradCache || bunny._gradCache.key !== cacheKey) {
        const bG = ctx.createRadialGradient(0, 2, 0, 0, 2, b.w * 0.5);
        bG.addColorStop(0, dm ? '#f0e0ff' : '#fff5f5'); bG.addColorStop(1, dm ? '#d8b0ff' : '#ffddee');
        const hG = ctx.createRadialGradient(-2, -14, 0, 0, -10, 20);
        hG.addColorStop(0, '#fff'); hG.addColorStop(1, dm ? '#ece0ff' : '#ffe8f0');
        bunny._gradCache = { key: cacheKey, body: bG, head: hG };
    }
    ctx.fillStyle = bunny._gradCache.body;
    ctx.beginPath(); ctx.ellipse(0, 4, b.w * 0.44, b.h * 0.41, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = dm ? '#b888dd' : '#e8a0b8'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = bunny._gradCache.head;
    ctx.beginPath(); ctx.ellipse(0, -10, 16, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = dm ? '#b888dd' : '#e8a0b8'; ctx.lineWidth = 1; ctx.stroke();

    const ew = Math.sin(gameTime * 3) * 0.12;
    for (let s of [-1, 1]) {
        ctx.save(); ctx.translate(s * 8, -22); ctx.rotate(s * 0.2 + ew * s);
        ctx.fillStyle = dm ? '#ece0ff' : '#ffe8f0';
        ctx.beginPath(); ctx.ellipse(0, -12, 5, 14, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = dm ? '#b888dd' : '#e8a0b8'; ctx.stroke();
        ctx.fillStyle = dm ? '#c8a0e8' : '#ffb0c8';
        ctx.beginPath(); ctx.ellipse(0, -11, 2.5, 9, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    const eyeY = b.isBlinking ? -10 : -12, eyeH = b.isBlinking ? 1 : 5;
    for (let s of [-1, 1]) {
        if (!b.isBlinking) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(s*6, eyeY, 4.5, eyeH+1, 0, 0, Math.PI*2); ctx.fill(); }
        ctx.fillStyle = dm ? '#8060c0' : '#4a2040';
        ctx.beginPath(); ctx.ellipse(s*6, eyeY, 3, eyeH, 0, 0, Math.PI*2); ctx.fill();
        if (!b.isBlinking) {
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(s*6+1.2, eyeY-2, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(s*6-0.8, eyeY+1, 0.8, 0, Math.PI*2); ctx.fill();
        }
    }
    ctx.fillStyle = dm ? 'rgba(180,140,255,0.4)' : 'rgba(255,150,180,0.4)';
    ctx.beginPath(); ctx.ellipse(-10, -6, 4.5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, -6, 4.5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = dm ? '#9070b0' : '#c07090'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, -5, 3.5, 0.1, Math.PI - 0.1); ctx.stroke();
    ctx.fillStyle = dm ? '#c090e0' : '#ff8fa8';
    ctx.beginPath(); ctx.ellipse(0, -8, 2, 1.5, 0, 0, Math.PI*2); ctx.fill();
    const tb = Math.sin(gameTime * 6) * 2;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-b.facing*17, 10+tb, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = dm ? '#b888dd' : '#e8a0b8'; ctx.lineWidth = 1; ctx.stroke();
    for (let s of [-1,1]) {
        ctx.fillStyle = dm ? '#e0d0f0' : '#ffe0ea';
        ctx.beginPath(); ctx.ellipse(s*8, b.h*0.37, 7, 4, s*0.2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = dm ? '#b888dd' : '#e8a0b8'; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

function drawFriend(f, idx) {
    const tierData = FRIEND_TIERS[f.tier];
    const type = tierData[f.typeIdx % tierData.length];
    const sc = 0.5 + f.tier * 0.12;
    ctx.save();
    ctx.translate(f.x, f.y + Math.sin(gameTime * 4 + idx * 1.5) * 3);
    ctx.scale(f.facing * sc, sc);

    // Aura for high tier
    if (type.aura) {
        ctx.globalAlpha = 0.25 + Math.sin(gameTime * 3) * 0.1;
        const ag = ctx.createRadialGradient(0, -3, 5, 0, -3, 25);
        ag.addColorStop(0, type.glow || '#fff'); ag.addColorStop(1, 'transparent');
        ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, -3, 25, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Crown for legendary
    if (type.legendary) {
        ctx.fillStyle = '#ffe040';
        ctx.beginPath(); ctx.moveTo(-8,-22); ctx.lineTo(-6,-30); ctx.lineTo(-2,-24); ctx.lineTo(0,-32);
        ctx.lineTo(2,-24); ctx.lineTo(6,-30); ctx.lineTo(8,-22); ctx.closePath(); ctx.fill();
    }

    ctx.fillStyle = type.color;
    ctx.beginPath(); ctx.ellipse(0, 2, 14, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = type.color;
    ctx.beginPath(); ctx.ellipse(0, -8, 11, 10, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    if (type.ear) for (let s of [-1,1]) {
        ctx.fillStyle = type.color;
        ctx.beginPath(); ctx.ellipse(s*7,-16,4,7,s*0.3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = type.accent;
        ctx.beginPath(); ctx.ellipse(s*7,-15,2,4,s*0.3,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#333';
    for (let s of [-1,1]) {
        ctx.beginPath(); ctx.ellipse(s*4,-9,2,2.5,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s*4+0.7,-10,0.8,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#333';
    }
    ctx.fillStyle = 'rgba(255,150,150,0.35)';
    ctx.beginPath(); ctx.ellipse(-7,-5,3,2,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7,-5,3,2,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(0,-5,2.5,0.2,Math.PI-0.2); ctx.stroke();

    // Tier stars
    if (f.tier > 0) {
        ctx.fillStyle = type.glow || '#ffe040';
        ctx.font = `bold ${8 + f.tier * 2}px "Segoe UI"`;
        ctx.textAlign = 'center';
        ctx.fillText('★'.repeat(f.tier), 0, 18);
    }

    ctx.restore();
}

function drawCloud(cloud) {
    ctx.save(); ctx.translate(cloud.x, cloud.y);
    const wb = Math.sin(gameTime * 2 + cloud.x * 0.01) * 2;
    let c1, c2;
    if (cloud.type === 'spring') { c1='#ffe0ff'; c2='#d8a0f0'; }
    else if (cloud.type === 'golden') { c1='#fff8d0'; c2='#ffe070'; }
    else if (cloud.type === 'rainbow') { c1='#ffe0e0'; c2='#e0e0ff'; }
    else { c1='#ffffff'; c2='#e0e8f8'; }
    const g = ctx.createRadialGradient(0,wb,0,0,wb,cloud.w*0.55);
    g.addColorStop(0,c1); g.addColorStop(1,c2);
    ctx.fillStyle = g; ctx.globalAlpha = 0.92;
    ctx.beginPath(); ctx.ellipse(0,wb,cloud.w*0.5,cloud.h*0.5,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-cloud.w*0.28,wb+2,cloud.w*0.32,cloud.h*0.38,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cloud.w*0.28,wb+2,cloud.w*0.32,cloud.h*0.38,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(0,wb-5,cloud.w*0.35,cloud.h*0.2,0,0,Math.PI*2); ctx.fill();
    if (cloud.hasFace) {
        ctx.globalAlpha = 0.45; ctx.fillStyle = '#888';
        ctx.beginPath(); ctx.arc(-cloud.w*0.12,wb-2,2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cloud.w*0.12,wb-2,2,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0,wb+3,4,0.2,Math.PI-0.2); ctx.stroke();
    }
    ctx.restore();
}

function drawMushroom(m) {
    ctx.save(); ctx.translate(m.x, m.y);
    const sq = m.squish || 1; ctx.scale(1/sq, sq);
    ctx.fillStyle = '#f0e8d8';
    ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-4,16); ctx.lineTo(4,16); ctx.lineTo(6,0); ctx.fill();
    ctx.strokeStyle = '#d0c8b8'; ctx.lineWidth = 1; ctx.stroke();
    const cG = ctx.createRadialGradient(0,-2,0,0,0,18);
    cG.addColorStop(0,m.color); cG.addColorStop(1,m.color2);
    ctx.fillStyle = cG;
    ctx.beginPath(); ctx.ellipse(0,-2,18,12,0,Math.PI,Math.PI*2); ctx.lineTo(18,-2); ctx.arc(0,-2,18,0,Math.PI); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(-7,-7,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-9,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-3,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-4,4,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,4,1.5,0,Math.PI*2); ctx.fill();

function drawRainbow(rb) {
    const colors = ['#ff6b6b','#ffa06b','#ffe06b','#6bff6b','#6bc4ff','#a06bff'];
    for (let i = colors.length-1; i >= 0; i--) {
        ctx.strokeStyle = colors[i]; ctx.lineWidth = 6-i*0.5;
        ctx.globalAlpha = 0.5 + rb.life * 0.4;
        ctx.beginPath(); ctx.moveTo(rb.x1,rb.y1);
        ctx.quadraticCurveTo((rb.x1+rb.x2)/2, Math.min(rb.y1,rb.y2)-80-i*4, rb.x2,rb.y2);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
}

function drawStar(x, y, size) {
    const rot = gameTime*2, pu = 1+Math.sin(gameTime*5+x)*0.12;
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(pu,pu);
    ctx.shadowColor = dreamMode ? '#c080ff' : '#ffe040'; ctx.shadowBlur = 12;
    ctx.fillStyle = dreamMode ? '#d0a0ff' : '#ffe040';
    ctx.beginPath();
    for (let i=0;i<5;i++) {
        const a1=(i*4*Math.PI)/5-Math.PI/2;
        ctx.lineTo(Math.cos(a1)*size, Math.sin(a1)*size);
        const a2=a1+Math.PI/5;
        ctx.lineTo(Math.cos(a2)*size*0.4, Math.sin(a2)*size*0.4);
    }
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff8c0'; ctx.beginPath(); ctx.arc(0,0,size*0.25,0,Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawFlower(x, y, size) {
    ctx.save(); ctx.translate(x, y + Math.sin(gameTime*3+x*0.1)*3);
    const hb = (x*0.5+gameTime*20)%360;
    for (let i=0;i<6;i++) {
        const a=(i/6)*Math.PI*2+gameTime*0.5;
        ctx.fillStyle = `hsl(${(hb+i*30)%360},80%,70%)`;
        ctx.beginPath(); ctx.ellipse(Math.cos(a)*size*0.45,Math.sin(a)*size*0.45,size*0.35,size*0.2,a,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#ffe060'; ctx.beginPath(); ctx.arc(0,0,size*0.25,0,Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawHeart(x, y, size) {
    ctx.save(); ctx.translate(x,y); const p=1+Math.sin(gameTime*6)*0.15; ctx.scale(p,p);
    ctx.fillStyle = '#ff4080'; ctx.beginPath();
    ctx.moveTo(0,size*0.3);
    ctx.bezierCurveTo(-size,-size*0.3,-size*0.5,-size,0,-size*0.4);

function drawFriendCollectible(x, y, typeIdx) {

function drawFirefly(ff) {
    const glow = 0.4+Math.sin(gameTime*ff.freq+ff.phase)*0.4;

    const rg = ctx.createRadialGradient(ff.x,ff.y,0,ff.x,ff.y,12);

    ctx.globalAlpha = glow+0.3; ctx.fillStyle = '#fff';

function drawBubbleRescue() {

function drawComboGarden() {
