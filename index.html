}

// ========== LEVEL HUD ==========
function drawHUD() {
    const lv = LEVELS[currentLevel];
    ctx.textAlign = 'left'; ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 4;

    // Level name
    ctx.font = 'bold 14px "Segoe UI"'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(`Level ${currentLevel+1}: ${lv.name}`, 18, 20);

    // Score
    ctx.font = 'bold 24px "Segoe UI"'; ctx.fillStyle = '#fff';
    ctx.fillText(`Score: ${score}`, 18, 46);

    // Level progress bar
    if (lv.scoreTo < Infinity) {
        const prevScore = currentLevel > 0 ? LEVELS[currentLevel-1].scoreTo : 0;
        const prog = Math.min((score - prevScore) / (lv.scoreTo - prevScore), 1);
        const bx = 18, by = 54, bw = 110, bh = 6;
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,3); ctx.fill();
        if (prog > 0) {
            const pg = ctx.createLinearGradient(bx,by,bx+bw*prog,by);
            pg.addColorStop(0,'#80ff80'); pg.addColorStop(1,'#40c040');
            ctx.fillStyle = pg;
            ctx.beginPath(); ctx.roundRect(bx,by,bw*prog,bh,3); ctx.fill();
        }
        ctx.font = '10px "Segoe UI"'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(`${lv.scoreTo - score} to next`, bx, by + 16);
    }

    // Friends + merge hint
    if (friends.length > 0) {
        ctx.font = '14px "Segoe UI"'; ctx.fillStyle = '#ffd080';
        ctx.fillText(`Friends: ${friends.length}`, 18, 88);
        if (mergeReady) {
            ctx.fillStyle = `hsl(${gameTime*60%360},100%,70%)`;
            ctx.font = 'bold 13px "Segoe UI"';
            ctx.fillText('Press M to merge!', 18, 104);
        }
    }

    // Combo
    if (combo > 1) {
        ctx.font = `bold ${16+Math.min(combo,8)}px "Segoe UI"`;
        ctx.fillStyle = `hsl(${combo*25},100%,72%)`;
        ctx.fillText(`x${combo}`, 18, friends.length > 0 ? 122 : 100);
    }

    // Dream meter
    const mw = 100, mh = 7, mx = W()/2-mw/2, my = 14;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.roundRect(mx,my,mw,mh,3.5); ctx.fill();
    const fill = Math.min(dreamMeter/100,1);
    if (fill > 0) {
        const mg = ctx.createLinearGradient(mx,my,mx+mw*fill,my);
        mg.addColorStop(0,'#c080ff'); mg.addColorStop(1,'#ff80c0');
        ctx.fillStyle = mg; ctx.beginPath(); ctx.roundRect(mx,my,mw*fill,mh,3.5); ctx.fill();
    }
    ctx.font = '9px "Segoe UI"'; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.textAlign = 'center';
    ctx.fillText(dreamMode ? 'DREAM MODE!' : 'Dream', W()/2, my+mh+10);

    // Energy bar (right side, prominent)
    const ebx = W()-160, eby = 18, ebw = 140, ebh = 14;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.roundRect(ebx-2,eby-2,ebw+4,ebh+4,9); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath(); ctx.roundRect(ebx,eby,ebw,ebh,7); ctx.fill();
    const eFill = Math.max(0,energy/maxEnergy);
    if (eFill > 0) {
        const eColor = eFill > 0.5 ? '#60dd60' : eFill > 0.25 ? '#ddcc40' : '#dd4040';
        const eGlow = eFill > 0.5 ? '#40ff40' : eFill > 0.25 ? '#ffee40' : '#ff4040';
        const eg = ctx.createLinearGradient(ebx,eby,ebx+ebw*eFill,eby);
        eg.addColorStop(0,eColor); eg.addColorStop(1,eGlow);
        ctx.fillStyle = eg;
        ctx.beginPath(); ctx.roundRect(ebx,eby,ebw*eFill,ebh,7); ctx.fill();
    }
    ctx.font = 'bold 10px "Segoe UI"'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText(`Energy ${Math.ceil(energy)}/${maxEnergy}`, ebx+ebw/2, eby+ebh-3);
    // Low energy warning pulse
    if (energy < 25 && energy > 0) {
        ctx.globalAlpha = 0.1 + Math.sin(gameTime * 6) * 0.08;
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(0, 0, W(), H());
        ctx.globalAlpha = 1;
    }

    ctx.textAlign = 'right'; ctx.font = '12px "Segoe UI"'; ctx.fillStyle = 'rgba(255,255,255,0.4)';
    const s = loadSave();
    ctx.fillText(`Best: ${s.highScore || 0}`, W()-18, eby+ebh+16);
    ctx.shadowBlur = 0; ctx.textAlign = 'left';

    // Level transition overlay
    if (levelTransition > 0) {
        ctx.fillStyle = `rgba(255,255,255,${levelTransition * 0.4})`;
        ctx.fillRect(0, 0, W(), H());
        ctx.font = 'bold 36px "Segoe UI"'; ctx.fillStyle = `rgba(255,255,255,${levelTransition})`;
        ctx.textAlign = 'center';
        ctx.fillText(`Level ${currentLevel+1}`, W()/2, H()/2 - 15);
        ctx.font = '22px "Segoe UI"'; ctx.fillStyle = `rgba(200,180,255,${levelTransition})`;
        ctx.fillText(LEVELS[currentLevel].name, W()/2, H()/2 + 15);
        ctx.textAlign = 'left';
    }

    // Merge flash
    if (mergeFlash > 0) {
        ctx.fillStyle = `rgba(255,220,255,${mergeFlash * 0.2})`;
        ctx.fillRect(0, 0, W(), H());
    }

    // Game over screen
    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W(), H());
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px "Segoe UI"'; ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(255,100,150,0.8)'; ctx.shadowBlur = 20;
        ctx.fillText('Out of Energy!', W()/2, H()/2-50);
        ctx.shadowBlur = 0;
        ctx.font = '26px "Segoe UI"'; ctx.fillStyle = '#ffd0e0';
        ctx.fillText(`Score: ${score}`, W()/2, H()/2);
        ctx.fillText(`Level: ${LEVELS[currentLevel].name}`, W()/2, H()/2+35);
        ctx.fillText(`Friends: ${friends.length} | Best Combo: x${maxCombo}`, W()/2, H()/2+70);
        if (score >= (loadSave().highScore||0) && score > 0) {
            ctx.font = 'bold 22px "Segoe UI"'; ctx.fillStyle = '#ffe040';
            ctx.fillText('New High Score!', W()/2, H()/2+105);
        }
        ctx.font = '18px "Segoe UI"'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText('Click or press Space to play again', W()/2, H()/2+140);
        ctx.textAlign = 'left';
    }
}

// ========== PARTICLES ==========
function spawnParticles(x,y,color,count,speed) {
    for (let i=0;i<count;i++) particles.push({
        x,y, vx:(Math.random()-0.5)*speed, vy:(Math.random()-0.8)*speed,
        life:1, decay:0.015+Math.random()*0.02, size:Math.random()*4+2, color,
        type: Math.random()>0.4?'circle':'star',
    });
}
function spawnTextParticle(x,y,text,color) {
    particles.push({x,y,vx:0,vy:-1.2,life:1,decay:0.012,size:18,color,text,type:'text'});
}
function updateParticles(dt) {
    if (particles.length > 300) particles.splice(0, particles.length - 300);
    for (let i=particles.length-1;i>=0;i--) {
        const p=particles[i]; p.x+=p.vx; p.y+=p.vy;
        if (p.type!=='text') p.vy+=0.08; p.life-=p.decay;
        if (p.life<=0) particles.splice(i,1);
    }
}
function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        if (p.type==='text') {
            ctx.font=`bold ${p.size}px "Segoe UI"`; ctx.fillStyle=p.color; ctx.textAlign='center';
            ctx.shadowColor=p.color; ctx.shadowBlur=8;
            ctx.fillText(p.text,p.x,p.y); ctx.shadowBlur=0;
        } else if (p.type==='star') { drawStar(p.x,p.y,p.size); }
        else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
}

// ========== INPUT ==========
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyM' && gameRunning && !gameOver) tryMerge();
    if (e.code === 'Digit1') handleMathInput(1);
    if (e.code === 'Digit2') handleMathInput(2);
    if (e.code === 'Digit3') handleMathInput(3);
    if ((e.code === 'Space' || e.code === 'Enter') && gameOver) { initGame(false); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousedown', () => { if(gameOver){initGame(false);return;} keys['_mouse'] = true; });
canvas.addEventListener('mouseup', () => { keys['_mouse'] = false; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); keys['_mouse'] = true; }, {passive:false});
canvas.addEventListener('touchend', () => { keys['_mouse'] = false; });

function wantsJump() { return keys['Space']||keys['ArrowUp']||keys['KeyW']||keys['_mouse']; }
function isLeft() { return keys['ArrowLeft']||keys['KeyA']; }
function isRight() { return keys['ArrowRight']||keys['KeyD']; }

// ========== SPAWN TIMERS ==========
let cloudT=0, collectT=0, mushT=0, rainbowT=0, friendT=0;
let jumpPressed = false, comboTimer = 0;

// ========== UPDATE ==========
function update(dt) {
    if (gameOver) return;

    // Rollercoaster mode has its own update
    if (wormholeMode) {
        updateWormhole(dt);
        updateParticles(dt);
        return;
    }

    // Time warp power
    const effectiveDt = dt * timeScale;
    gameTime += effectiveDt;
    const lv = LEVELS[currentLevel];
    const b = bunny;

    // Update active power
    updatePower(effectiveDt);

    // Level transitions
    if (levelTransition > 0) levelTransition -= dt * 0.8;
    if (mergeFlash > 0) mergeFlash -= dt * 2;

    // Check rollercoaster trigger
    if (score >= nextWormholeScore && !wormholeMode && energy > 0) {
        startWormhole();
        return;
    }

    // Check level up
    if (currentLevel < LEVELS.length - 1 && score >= lv.scoreTo) {
        currentLevel++;
        levelTransition = 1.5;
        spawnParticles(W()/2, H()/2, '#fff', 25, 8);
        saveGame();
    }

    // Movement
    const hasSpeed = activePower && activePower.typeIdx === 0;
    const hasShield = activePower && activePower.typeIdx === 1;
    const hasBounce = activePower && activePower.typeIdx === 4;
    const hasSurf = activePower && activePower.typeIdx === 5;
    const hasFlight = activePower && activePower.typeIdx === 7;
    const spd = hasSpeed ? 7 : dreamMode ? 5 : 4;
    if (isLeft()) { b.vx = Math.max(b.vx-0.6, -spd); b.facing = -1; }
    else if (isRight()) { b.vx = Math.min(b.vx+0.6, spd); b.facing = 1; }
    else { b.vx *= 0.85; }

    // Wind effect on bunny
    if (lv.weather === 'breeze' || lv.weather === 'rain') b.vx += windSpeed * 0.15;

    // Eagle flight: nearly zero gravity, free movement
    if (hasFlight) {
        b.vy += 0.03; // almost floating
        if (wantsJump()) b.vy = Math.max(b.vy - 0.8, -6);
        if (keys['ArrowDown'] || keys['KeyS']) b.vy = Math.min(b.vy + 0.5, 4);
    } else if (hasSurf) {
        b.vy += 0.08; // very floaty
    } else {
        b.vy += dreamMode ? 0.22 : 0.28;
    }

    // Jump
    const jn = wantsJump();
    if (jn && !jumpPressed) {
        if (b.onGround) {
            b.vy = hasBounce ? -14 : dreamMode ? -10 : -8.5; b.onGround = false; b.doubleJump = true;
            b.squash = 0.7; b.stretch = 1.3;
            spawnParticles(b.x,b.y+b.h/2,'#fff',5,2.5);
        } else if (b.doubleJump) {
            b.vy = dreamMode ? -9 : -7.5; b.doubleJump = false;
            b.squash = 0.75; b.stretch = 1.25;
            spawnParticles(b.x,b.y,dreamMode?'#c080ff':'#ffc0e0',8,3);
        }
    }
    jumpPressed = jn;

    b.gliding = (jn && b.vy > 0 && !b.onGround) || hasSurf;
    if (b.gliding && !hasFlight) b.vy = Math.min(b.vy, hasSurf ? 0.5 : 2);

    b.x += b.vx; b.y += b.vy;

    // Screen wrap
    if (b.x < -20) b.x = W()+20;
    if (b.x > W()+20) b.x = -20;

    b.squash += (1-b.squash)*0.15; b.stretch += (1-b.stretch)*0.15;
    b.blinkTimer += dt;
    if (b.blinkTimer > 3+Math.random()*2) { b.isBlinking = true; setTimeout(()=>{b.isBlinking=false;},150); b.blinkTimer=0; }
    if (b.happyTimer > 0) b.happyTimer -= dt*0.5;
    if (b.invincible > 0) b.invincible -= dt;

    b.trail.push({x:b.x,y:b.y});
    if (b.trail.length > 10) b.trail.shift();
    b.onGround = false;

    // Ground level with hazards
    const groundY = H() * 0.89;

    // Spawn ground hazards
    if (groundHazards.length < 6 + currentLevel) {
        const types = ['safe','safe','safe','bounce','thorn','thorn','chaser'];
        const type = types[Math.floor(Math.random() * types.length)];
        groundHazards.push({
            x: W() + 30 + Math.random() * 60,
            w: type === 'safe' ? 60 + Math.random() * 80 : type === 'bounce' ? 40 : type === 'thorn' ? 30 + Math.random() * 20 : 20,
            type,
            speed: 0.3 + Math.random() * 0.3 + currentLevel * 0.03,
            // Chaser-specific
            chaserVy: 0, chaserJump: 0, alive: true,
        });
    }

    // Update ground hazards
    for (let i = groundHazards.length - 1; i >= 0; i--) {
        const h = groundHazards[i];
        h.x -= h.speed;
        if (h.x + h.w < -50) { groundHazards.splice(i, 1); continue; }

        if (h.type === 'chaser' && h.alive) {
            // Chasers hop toward bunny
            h.chaserJump -= effectiveDt;
            if (h.chaserJump <= 0) {
                h.chaserVy = -3 - Math.random() * 2;
                h.chaserJump = 1 + Math.random();
            }
        }
    }

    // Ground collision - check what we're landing on
    if (b.y + b.h * 0.4 > groundY && b.vy > 0) {
        b.y = groundY - b.h * 0.4;
        b.onGround = true; b.doubleJump = true;
        b.squash = 1.3; b.stretch = 0.7;

        // Check which ground hazard we're on
        let onHazard = null;
        for (const h of groundHazards) {
            if (b.x > h.x - 10 && b.x < h.x + h.w + 10) { onHazard = h; break; }
        }

        if (onHazard && onHazard.type === 'bounce') {
            b.vy = -14; b.onGround = false;
            spawnParticles(b.x, groundY, '#80ff80', 8, 4);
            spawnTextParticle(b.x, b.y - 25, 'Boing!', '#60ff60');
            score += 5;
        } else if (onHazard && onHazard.type === 'thorn' && groundDmgCooldown <= 0 && !hasShield) {
            const dmg = 6 + currentLevel * 2;
            energy -= dmg; groundDmgCooldown = 0.6; combo = 0;
            b.vy = -9; b.onGround = false;
            screenShake = 0.3;
            spawnParticles(b.x, groundY, '#c04080', 10, 5);
            spawnTextParticle(b.x, b.y - 20, `-${dmg}`, '#ff4060');
            playCollectSound('hurt');
        } else if (onHazard && onHazard.type === 'thorn' && hasShield) {
            b.vy = -5; b.onGround = false;
            if (groundDmgCooldown <= 0) {
                groundDmgCooldown = 0.3;
                spawnParticles(b.x, groundY, '#60d0ff', 5, 3);
            }
        } else {
            // Safe ground or no specific hazard - just land
            b.vy = 0;
        }
    }

    // Chaser collision (they chase you and your friends!)
    for (const h of groundHazards) {
        if (h.type !== 'chaser' || !h.alive) continue;
        const chaserDist = Math.hypot(b.x - h.x, b.y - groundY);
        if (chaserDist < 30 && groundDmgCooldown <= 0 && !hasShield) {
            energy -= 10; groundDmgCooldown = 0.8; combo = 0;
            screenShake = 0.3;
            spawnParticles(h.x, groundY - 10, '#ff4040', 10, 5);
            spawnTextParticle(b.x, b.y - 25, '-10', '#ff4040');
            playCollectSound('hurt');
            h.alive = false;
        }
        // Chasers can steal friends!
        for (let fi = friends.length - 1; fi >= 0; fi--) {
            if (Math.hypot(friends[fi].x - h.x, friends[fi].y - groundY) < 25) {
                spawnParticles(friends[fi].x, friends[fi].y, '#ff6060', 8, 4);
                spawnTextParticle(friends[fi].x, friends[fi].y - 20, 'Friend stolen!', '#ff4040');
                friends.splice(fi, 1); h.alive = false;
                checkMergeReady();
                break;
            }
        }
    }
    if (groundDmgCooldown > 0) groundDmgCooldown -= dt;

    // Energy regen (slow, faster when on clouds)
    if (b.onGround && b.y + b.h * 0.4 < groundY - 5) {
        // On a cloud - regen faster
        energyRegenTimer += dt;
        if (energyRegenTimer > 0.5) { energy = Math.min(maxEnergy, energy + 1); energyRegenTimer = 0; }
    } else if (!b.onGround) {
        energyRegenTimer += dt;
        if (energyRegenTimer > 2) { energy = Math.min(maxEnergy, energy + 0.5); energyRegenTimer = 0; }
    }

    // Game over when energy depleted
    if (energy <= 0 && !gameOver) {
        energy = 0; gameOver = true;
        saveGame();
        spawnParticles(b.x, b.y, '#ff4040', 20, 6);
    }

    // Bubble rescue only when falling below screen (safety net for edge cases)
    if (b.y > H() + 50 && !bubbleRescue && !gameOver) {
        bubbleRescue = true; b.vy = -8; energy -= 15;
        spawnParticles(b.x, H(), 'rgba(200,180,255,0.8)', 10, 3);
    }
    if (bubbleRescue) {
        b.vy = Math.min(b.vy, -3);
        if (b.y < H() * 0.4) { bubbleRescue = false; b.vy = -2; }
    }

    // Clouds - act as solid platforms from above
    for (const c of clouds) {
        c.x -= c.speed;
        const top = c.y - c.h * 0.3;
        const halfW = c.w * 0.55; // wider hitbox for easier landing
        const prevBottom = (b.y - b.vy) + b.h * 0.4; // where feet were last frame
        const feetY = b.y + b.h * 0.4;

        // Land on cloud if: falling, feet cross the top surface, horizontally within cloud
        if (b.vy > 0 && !bubbleRescue &&
            b.x > c.x - halfW && b.x < c.x + halfW &&
            prevBottom <= top + 4 && feetY >= top - 2) {
            b.y = top - b.h * 0.4;
            b.vy = 0; b.onGround = true; b.doubleJump = true;
            b.squash = 1.15; b.stretch = 0.85;
            if (!c.bounced) {
                c.bounced = true;
                if (c.type==='spring') { b.vy=-13; b.onGround=false; spawnParticles(b.x,b.y+20,'#ff80ff',10,5); spawnTextParticle(b.x,b.y-30,'Boing!','#ff80ff'); score+=5; }
                else if (c.type==='golden') { score+=15; spawnParticles(b.x,b.y,'#ffe040',15,5); spawnTextParticle(b.x,b.y-30,'+15','#ffe040'); }
                else if (c.type==='rainbow') { dreamMeter=Math.min(100,dreamMeter+15); spawnParticles(b.x,b.y,'#ff80c0',10,4); spawnTextParticle(b.x,b.y-30,'Dream+','#c080ff'); }
            }
        }
        // Also let bunny stay on cloud while standing (moving with it)
        if (b.onGround && b.vy === 0 &&
            b.x > c.x - halfW && b.x < c.x + halfW &&
            Math.abs(feetY - top) < 8) {
            b.y = top - b.h * 0.4; // stick to cloud
            b.x -= c.speed * 0.3; // move slightly with cloud
        }
    }

    // Safety net: ensure there's always a cloud below the bunny
    let cloudsBelowCount = 0;
    for (let i = 0; i < clouds.length; i++) { const c = clouds[i]; if (c.y > b.y && c.x > b.x - 200 && c.x < b.x + 200) cloudsBelowCount++; }
    if (cloudsBelowCount < 2 && !bubbleRescue) {
        clouds.push({
            x: b.x + (Math.random() - 0.5) * 100,
            y: Math.min(b.y + 120 + Math.random() * 60, H() * 0.8),
            w: 85 + Math.random() * 40, h: 26 + Math.random() * 10,
            speed: 0.2 + Math.random() * 0.15,
            type: 'normal', bounced: false, hasFace: Math.random() > 0.7,
        });
    }

    // Mushrooms
    for (const m of mushrooms) {
        m.x -= m.speed;
        if (b.vy > 0 && !bubbleRescue && b.x > m.x-18 && b.x < m.x+18 &&
            b.y+b.h*0.4 > m.y-12 && b.y+b.h*0.4 < m.y) {
            b.vy = -14; b.onGround = false; b.doubleJump = true; m.squish = 0.6;
            score += 8; spawnParticles(m.x,m.y-10,'#ff80ff',12,5);
            spawnTextParticle(m.x,m.y-35,'Sproing!','#ff60a0'); playCollectSound('spring');
        }
        if (m.squish < 1) m.squish += (1-m.squish)*0.1;
    }

    // Rainbows
    for (let i=rainbows.length-1;i>=0;i--) {
        const rb=rainbows[i]; rb.life-=dt*0.08; rb.x1-=0.3; rb.x2-=0.3;
        if (rb.life>0 && b.vy>=0 && !bubbleRescue) {
            const t=(b.x-rb.x1)/(rb.x2-rb.x1);
            if (t>=0&&t<=1) {
                const rbY=rb.y1+(rb.y2-rb.y1)*t-80*4*t*(1-t);
                if (b.y+b.h*0.4>rbY-5 && b.y+b.h*0.4<rbY+10) {
                    b.y=rbY-5-b.h*0.4; b.vy=0; b.onGround=true; b.doubleJump=true;
                }
            }
        }
        if (rb.life<=0||rb.x2<-100) rainbows.splice(i,1);
    }

    // Collectibles
    for (let i=collectibles.length-1;i>=0;i--) {
        const c=collectibles[i]; c.x -= c.speed;
        const d = Math.hypot(b.x-c.x, b.y-c.y);
        if (d < 25) {
            combo++; maxCombo=Math.max(maxCombo,combo); comboTimer=2.5; totalCollected++;
            b.happyTimer=1; dreamMeter=Math.min(100,dreamMeter+(dreamMode?2:4));
            const bonus=Math.min(combo,12);
            if (c.type==='star') {
                score+=5*bonus; energy=Math.min(maxEnergy,energy+1); spawnParticles(c.x,c.y,'#ffe040',8,3.5); spawnTextParticle(c.x,c.y-15,`+${5*bonus}`,'#ffe040'); playCollectSound('star');
            } else if (c.type==='flower') {
                score+=3*bonus; energy=Math.min(maxEnergy,energy+3); spawnParticles(c.x,c.y,'#ff80a0',8,3); spawnTextParticle(c.x,c.y-15,`+${3*bonus}`,'#ff80a0'); playCollectSound('flower');
            } else if (c.type==='heart') {
                energy=Math.min(maxEnergy,energy+20); score+=10;
                spawnParticles(c.x,c.y,'#ff4080',12,5); spawnTextParticle(c.x,c.y-15,'+20 Energy','#ff4080'); playCollectSound('heart');
            } else if (c.type==='friend') {
                score+=20;
                friends.push({x:b.x,y:b.y-20,tier:0,typeIdx:c.friendType,facing:1});
                spawnParticles(c.x,c.y,'#ffd080',15,5); spawnTextParticle(c.x,c.y-20,'New Friend!','#ffd080'); playCollectSound('heart');
                checkMergeReady();
                // Auto-merge if max friends exceeded
                if (friends.length > 8) tryMerge();
            }
            if (combo>0 && combo%3===0) {
                const hues=['#ff80a0','#ffa060','#ffe060','#80e0a0','#80c0ff','#c080ff'];
                gardenFlowers.push({x:Math.random()*W(),born:gameTime,height:10+Math.random()*15,size:4+Math.random()*4,color:hues[Math.floor(Math.random()*hues.length)]});
                if (gardenFlowers.length>30) gardenFlowers.shift();
            }
            collectibles.splice(i,1); continue;
        }
        if (c.x<-50) { collectibles.splice(i,1); combo=0; }
    }

    if (comboTimer>0) { comboTimer-=dt; if (comboTimer<=0) combo=0; }

    // Dream mode
    if (dreamMeter>=100 && !dreamMode) {
        dreamMode=true; dreamModeTimer=15;
        const ds=loadSave(); cachedSave=null; ds.dreamActivations=(ds.dreamActivations||0)+1;
        localStorage.setItem('cloudBunny3',JSON.stringify(ds)); checkAchievements();
        spawnParticles(b.x,b.y,'#c080ff',30,8); spawnTextParticle(b.x,b.y-40,'DREAM MODE!','#e0b0ff');
        screenShake=0.3;
    }
    if (dreamMode) { dreamModeTimer-=dt; dreamMeter=(dreamModeTimer/15)*100; if (dreamModeTimer<=0){dreamMode=false;dreamMeter=0;} }

    // Friends follow
    for (let i=0;i<friends.length;i++) {
        const f=friends[i], leader=i===0?b:friends[i-1];
        const tx=leader.x-leader.facing*22, ty=leader.y+5;
        f.x+=(tx-f.x)*0.06; f.y+=(ty-f.y)*0.06;
        f.facing=f.x<leader.x?1:-1;
    }

    // Fireflies
    for (const ff of fireflies) {
        ff.x+=ff.vx+Math.sin(gameTime*0.5+ff.phase)*0.2;
        ff.y+=ff.vy+Math.cos(gameTime*0.7+ff.phase)*0.15;
        if (ff.x<-20) ff.x=W()+20; if (ff.x>W()+20) ff.x=-20;
        if (ff.y<-20) ff.y=H()*0.7; if (ff.y>H()*0.7) ff.y=-20;
    }

    // Cleanup (filter + cap to prevent unbounded growth)
    clouds = clouds.filter(c=>c.x>-130);
    if (clouds.length > 25) clouds.splice(0, clouds.length - 25);
    mushrooms = mushrooms.filter(m=>m.x>-40);
    if (collectibles.length > 40) collectibles.splice(0, collectibles.length - 40);

    // Spawns
    const sr = lv.spawnRate;
    cloudT+=dt; if (cloudT>1.6*sr) { clouds.push(makeCloud()); cloudT=0; }
    collectT+=dt; if (collectT>0.95*sr) {
        const types=['star','star','star','flower','flower','heart'];
        collectibles.push({x:W()+40,y:H()*0.12+Math.random()*H()*0.55,type:types[Math.floor(Math.random()*types.length)],size:10+Math.random()*5,speed:0.6+Math.random()*0.4+currentLevel*0.03});
        collectT=0;
    }
    friendT+=dt; if (friendT>7) {
        collectibles.push({x:W()+40,y:H()*0.2+Math.random()*H()*0.4,type:'friend',friendType:Math.floor(Math.random()*FRIEND_TIERS[0].length),size:14,speed:0.5+Math.random()*0.3});
        friendT=0;
    }
    mushT+=dt; if (mushT>5.5) { mushrooms.push(makeMushroom()); mushT=0; }
    rainbowT+=dt; if (rainbowT>11) {
        const x1=W()+50;
        rainbows.push({x1,y1:H()*0.5+Math.random()*H()*0.2,x2:x1+150+Math.random()*100,y2:H()*0.4+Math.random()*H()*0.3,life:1});
        rainbowT=0;
    }
    if (fireflies.length<15 && Math.random()<0.005) fireflies.push(makeFirefly());

    // Learning gates - trigger periodically during normal gameplay
    if (achievementPopupTimer > 0) achievementPopupTimer -= dt;
    learningGateTimer += dt;
    if (learningGateTimer > 45 && !learningGate && !wormholeMode && score > 100) {
        triggerLearningGate(); learningGateTimer = 0;
    }

    updateWeather(dt);
    updateParticles(dt);
    if (screenShake>0) screenShake*=0.9;

    // Check achievements periodically
    if (Math.floor(gameTime) % 5 === 0) checkAchievements();

    // Periodic save
    const saveFloor = Math.floor(gameTime);
    if (saveFloor > 0 && saveFloor % 30 === 0 && saveFloor !== lastSaveFloor) { lastSaveFloor = saveFloor; saveGame(); }
}

// ========== DRAW ==========
function draw() {
    // Rollercoaster has its own draw
    if (wormholeMode) {
        drawWormhole();
        drawParticles();
        return;
    }

    ctx.save();
    if (screenShake>0.01) ctx.translate((Math.random()-0.5)*screenShake*15,(Math.random()-0.5)*screenShake*15);

    // Power visual effects on background
    if (activePower && activePower.typeIdx === 7) {
        // Eagle flight: add wing-like wind streaks
        ctx.globalAlpha = 0.15;
        for (let i = 0; i < 5; i++) {
            const y = (gameTime * 200 + i * 80) % H();
            ctx.strokeStyle = '#c0a060'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W(), y + (Math.random()-0.5)*20); ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    drawBackground();
    drawComboGarden();

    // Fireflies behind
    const lv = LEVELS[currentLevel];
    if (['fireflies','aurora','cosmic','dream'].includes(lv.weather)) {
        for (const ff of fireflies) drawFirefly(ff);
    }

    drawWeather();

    for (const rb of rainbows) drawRainbow(rb);
    for (const c of clouds) drawCloud(c);
    for (const m of mushrooms) drawMushroom(m);

    // Ground hazards
    const gY = H() * 0.89;
    for (const h of groundHazards) {
        if (h.type === 'safe') {
            ctx.fillStyle = '#6a9060'; // grass patch
            ctx.beginPath(); ctx.roundRect(h.x, gY - 4, h.w, 10, 3); ctx.fill();
            // Tiny flowers on safe ground
            for (let fx = h.x + 8; fx < h.x + h.w - 8; fx += 15) {
                ctx.fillStyle = `hsl(${(fx * 7 + gameTime * 20) % 360}, 70%, 65%)`;
                ctx.beginPath(); ctx.arc(fx, gY - 6, 3, 0, Math.PI * 2); ctx.fill();
            }
        } else if (h.type === 'bounce') {
            ctx.save(); ctx.translate(h.x + h.w / 2, gY);
            ctx.fillStyle = '#ff80ff';
            ctx.beginPath(); ctx.ellipse(0, -6, h.w * 0.5, 8, 0, Math.PI, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#d060d0';
            ctx.beginPath(); ctx.ellipse(0, -2, h.w * 0.5, 5, 0, 0, Math.PI); ctx.fill();
            // Spring coil
            ctx.strokeStyle = '#c0c0c0'; ctx.lineWidth = 2;
            for (let sy = 2; sy < 12; sy += 3) {
                ctx.beginPath(); ctx.moveTo(-6, sy); ctx.lineTo(6, sy + 1.5); ctx.stroke();
            }
            ctx.restore();
        } else if (h.type === 'thorn') {
            // Spiky thorns
            ctx.fillStyle = '#802060';
            for (let tx = h.x; tx < h.x + h.w; tx += 8) {
                ctx.beginPath();
                ctx.moveTo(tx, gY);
                ctx.lineTo(tx + 4, gY - 14 - Math.sin(gameTime * 3 + tx * 0.1) * 3);
                ctx.lineTo(tx + 8, gY);
                ctx.fill();
            }
            // Poison glow
            ctx.globalAlpha = 0.3 + Math.sin(gameTime * 4) * 0.15;
            ctx.fillStyle = '#c040a0';
            ctx.beginPath(); ctx.ellipse(h.x + h.w / 2, gY - 8, h.w * 0.5, 10, 0, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
        } else if (h.type === 'chaser' && h.alive) {
            // Evil shadow creature
            ctx.save();
            ctx.translate(h.x, gY - 12);
            const cBob = Math.sin(gameTime * 6 + h.x) * 3;
            ctx.translate(0, cBob);
            // Body (dark blob)
            const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 14);
            cg.addColorStop(0, '#302'); cg.addColorStop(1, '#201');
            ctx.fillStyle = cg;
            ctx.beginPath(); ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2); ctx.fill();
            // Angry eyes
            ctx.fillStyle = '#f44';
            ctx.beginPath(); ctx.arc(-5, -3, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(5, -3, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(-5, -4, 1, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(5, -4, 1, 0, Math.PI * 2); ctx.fill();
            // Angry mouth
            ctx.strokeStyle = '#f44'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(0, 2, 4, Math.PI + 0.3, -0.3); ctx.stroke();
            ctx.restore();
        }
    }
    for (const c of collectibles) {
        if (c.type==='star') drawStar(c.x,c.y,c.size);
        else if (c.type==='flower') drawFlower(c.x,c.y,c.size);
        else if (c.type==='heart') drawHeart(c.x,c.y+Math.sin(gameTime*3+c.x)*4,c.size);
        else if (c.type==='friend') drawFriendCollectible(c.x,c.y,c.friendType);
    }

    // Trail
    for (let i=0;i<bunny.trail.length;i++) {
        const t=bunny.trail[i]; ctx.globalAlpha=(i/bunny.trail.length)*0.18;
        ctx.fillStyle = dreamMode?`hsl(${(gameTime*100+i*30)%360},80%,70%)`:'#ffb0d0';
        ctx.beginPath(); ctx.arc(t.x,t.y,7,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    for (let i=friends.length-1;i>=0;i--) drawFriend(friends[i],i);
    drawBubbleRescue();
    drawBunny();
    drawParticles();
    drawHUD();
    drawPowerHUD();
    drawLearningGate();
    drawAchievementPopup();

    // Power aura around bunny
    if (activePower) {
        ctx.globalAlpha = 0.2 + Math.sin(gameTime * 4) * 0.1;
        const ag = ctx.createRadialGradient(bunny.x, bunny.y, 10, bunny.x, bunny.y, 45);
        ag.addColorStop(0, activePower.color); ag.addColorStop(1, 'transparent');
        ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(bunny.x, bunny.y, 45, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

// ========== AUDIO ==========
let musicEnabled=true, synths=[], sfxSynth=null, midiLoopTimeout=null;
document.getElementById('musicToggle').addEventListener('click',function(){
    musicEnabled=!musicEnabled; this.textContent=`Music: ${musicEnabled?'ON':'OFF'}`;
    synths.forEach(s=>{try{s.volume.value=musicEnabled?-10:-Infinity;}catch(e){}});
});
function initAudio(){
    if(sfxSynth)return;
    sfxSynth=new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:0.01,decay:0.15,sustain:0,release:0.1},volume:-14}).toDestination();
}
let lastSfxTime = 0, sfxCooldown = 50; // ms between sounds
function playCollectSound(type){
    if(!sfxSynth)return;
    const now = performance.now();
    if (now - lastSfxTime < sfxCooldown) return; // debounce rapid sounds
    lastSfxTime = now;
    try{
        if(type==='star'){sfxSynth.triggerAttackRelease('E5','16n');setTimeout(()=>sfxSynth.triggerAttackRelease('G5','16n'),50);}
        else if(type==='flower'){sfxSynth.triggerAttackRelease('C5','16n');setTimeout(()=>sfxSynth.triggerAttackRelease('E5','16n'),70);}
        else if(type==='heart'){sfxSynth.triggerAttackRelease('C5','8n');setTimeout(()=>sfxSynth.triggerAttackRelease('E5','8n'),90);setTimeout(()=>sfxSynth.triggerAttackRelease('G5','8n'),180);}
        else if(type==='spring'){sfxSynth.triggerAttackRelease('G4','16n');setTimeout(()=>sfxSynth.triggerAttackRelease('C5','16n'),40);setTimeout(()=>sfxSynth.triggerAttackRelease('E5','16n'),80);}
        else if(type==='evolve'){sfxSynth.triggerAttackRelease('C5','8n');setTimeout(()=>sfxSynth.triggerAttackRelease('E5','8n'),100);setTimeout(()=>sfxSynth.triggerAttackRelease('G5','8n'),200);setTimeout(()=>sfxSynth.triggerAttackRelease('C6','4n'),300);}
        else if(type==='hurt'){sfxSynth.triggerAttackRelease('E3','8n');setTimeout(()=>sfxSynth.triggerAttackRelease('C3','8n'),80);}
        else if(type==='power'){sfxSynth.triggerAttackRelease('C5','8n');setTimeout(()=>sfxSynth.triggerAttackRelease('E5','8n'),80);setTimeout(()=>sfxSynth.triggerAttackRelease('G5','8n'),160);setTimeout(()=>sfxSynth.triggerAttackRelease('C6','4n'),240);setTimeout(()=>sfxSynth.triggerAttackRelease('E6','4n'),360);}
    }catch(e){}
}
let musicSwitchTimer = null;
function switchMusic(mode) {
    if (mode === currentMusicMode) return;
    currentMusicMode = mode;
    synths.forEach(s => { try { s.volume.rampTo(-Infinity, 0.5); } catch(e){} });
    if (midiLoopTimeout) clearTimeout(midiLoopTimeout);
    if (musicSwitchTimer) clearTimeout(musicSwitchTimer);
    musicSwitchTimer = setTimeout(() => {
        musicSwitchTimer = null;
        synths.forEach(s => { try { s.dispose(); } catch(e){} });
        synths = [];
        loadAndPlayMidi();
    }, 500);
}

async function loadAndPlayMidi(){
    try{
        const midiSets = {
            normal: ['happy-dance.mid','funfunfu.mid','watching-rainbows.mid'],
            power: ['power-up.mid','aurora.mid'],
            rollercoaster: ['rollercoaster.mid'],
        };
        const files = midiSets[currentMusicMode] || midiSets.normal;
        const chosen=files[Math.floor(Math.random()*files.length)];
        const resp=await fetch(chosen); const buf=await resp.arrayBuffer(); const midi=new Midi(buf);
        synths.forEach(s=>{try{s.dispose();}catch(e){}}); synths=[];
        if(midiLoopTimeout)clearTimeout(midiLoopTimeout);
        const now=Tone.now()+0.5;
        const tracks=midi.tracks.filter(t=>t.notes.length>0).slice(0,4);
        for(const track of tracks){
            const synth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:0.02,decay:0.3,sustain:0.4,release:0.8},volume:-10}).toDestination();
            synths.push(synth);
            for(const note of track.notes) synth.triggerAttackRelease(note.name,note.duration,now+note.time,note.velocity*0.5);
        }
        if(midi.duration>0) midiLoopTimeout=setTimeout(()=>{if(musicEnabled)loadAndPlayMidi();},(midi.duration+2)*1000);
    }catch(e){console.log('MIDI failed:',e);playProceduralMusic();}
}
function playProceduralMusic(){
    const mel=new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.05,decay:0.3,sustain:0.3,release:0.5},volume:-12}).toDestination();
    synths.push(mel);
    const notes=['C4','E4','G4','A4','B4','A4','G4','E4','F4','A4','C5','A4','G4','F4','E4','D4'];
    let idx=0;
    new Tone.Loop(time=>{if(!musicEnabled)return;mel.triggerAttackRelease(notes[idx%notes.length],'8n',time);idx++;},'4n').start(0);
    Tone.Transport.bpm.value=128; Tone.Transport.start();
}

// ========== START ==========
async function startGame(continued) {
    document.getElementById('startScreen').style.display='none';
    await Tone.start(); initAudio(); loadAchievements(); initGame(continued); gameRunning=true;
    loadAndPlayMidi(); requestAnimationFrame(gameLoop);
}
document.getElementById('startBtn').addEventListener('click',()=>startGame(false));
document.getElementById('continueBtn').addEventListener('click',()=>startGame(true));

let lastTime=0;
function gameLoop(ts){
    if(!gameRunning)return;
    if(lastTime===0){lastTime=ts;requestAnimationFrame(gameLoop);return;}
    const dt=Math.min((ts-lastTime)/1000,0.05); lastTime=ts;
    update(dt); draw(); requestAnimationFrame(gameLoop);
}
